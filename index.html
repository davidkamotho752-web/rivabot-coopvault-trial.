<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoopVault</title>
<meta name="theme-color" content="#0b5d3b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--g:#0b5d3b;--g2:#e6f2ec;--bg:#f4f6f5;--tx:#17211c;--mu:#5a665f;--bd:#d9e0dc;--red:#b3261e;--amb:#8a4d00;--blue:#1b5fa8;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;padding-bottom:76px}
/* Global watermark: above content (screenshots always carry it), click-through, per-user text set by JS */
body::after{content:"";position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9000;background-image:var(--wm,none);background-repeat:repeat}
.skip{position:absolute;left:-999px;top:0;background:#fff;color:#000;padding:8px;z-index:9999}.skip:focus{left:8px}
:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
header{background:var(--g);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header b{font-size:17px}header small{opacity:.85}
header .sp{flex:1}
header .who{font-size:13px;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:99px}
main{max-width:980px;margin:0 auto;padding:12px 14px}
h1,h2{margin:6px 0 10px;font-size:19px}h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi .n{font-size:20px;font-weight:700}.kpi .l{color:var(--mu);font-size:12.5px}
.muted{color:var(--mu)}.small{font-size:13px}
.btn{font:inherit;border:1px solid var(--g);background:var(--g);color:#fff;padding:9px 14px;border-radius:9px;cursor:pointer;margin:2px 4px 2px 0}
.btn.sec{background:#fff;color:var(--g)}.btn.danger{background:var(--red);border-color:var(--red)}.btn.sm{padding:5px 10px;font-size:13px}
header .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid #9aa7a0;border-radius:8px;background:#fff;margin:3px 0 8px;color:var(--tx)}
label{font-size:13px;color:var(--mu);display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#eceff1;color:#37474f;white-space:nowrap}
.badge.ok{background:#dff3e6;color:#0a6b35}.badge.warn{background:#fff0d6;color:var(--amb)}.badge.bad{background:#fde3e1;color:var(--red)}.badge.info{background:#e1edfa;color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:600}
.tw{overflow-x:auto}
nav.bot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:60}
nav.bot button{flex:1;border:0;background:none;padding:12px 2px 14px;font:inherit;font-size:13px;color:var(--mu);cursor:pointer}
nav.bot button.on{color:var(--g);font-weight:700;border-top:3px solid var(--g);padding-top:9px}
.ok{color:#0a6b35}.bad{color:var(--red)}
.chk{padding:2px 0}.chk::before{content:"✗ ";color:var(--red);font-weight:700}.chk.y::before{content:"✓ ";color:#0a6b35}
.roles{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.roles button{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px 8px;font:inherit;cursor:pointer;text-align:center;color:var(--tx)}
.roles button:hover{border-color:var(--g);background:var(--g2)}
#toasts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:9500;display:flex;flex-direction:column;gap:6px;align-items:center;max-width:92vw}
.toast{background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px}.toast.err{background:var(--red)}
.demo{background:#fff8e1;border:1px dashed #d9a400;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.login{max-width:560px;margin:20px auto}
details summary{cursor:pointer;color:var(--g)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.bub{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:88%;white-space:pre-wrap}.bub.me{background:var(--g2);margin-left:auto}.bub.bot{background:#f0f2f1}
.sim li{margin:2px 0}
/* Lite mode: text-first, bigger, higher contrast — for slow phones / small screens */
html.lite body{font-size:17px;background:#fff}html.lite .card,html.lite .kpi{border-radius:0;border-color:#000}
html.lite .btn{padding:12px 16px;min-height:44px}html.lite input,html.lite select,html.lite textarea{min-height:44px;border-color:#000}
html.lite header{position:static}html.lite .muted{color:#333}
@media print{header,nav.bot,.noprint,button,.skip{display:none!important}body{background:#fff;padding:0}.card{border:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9600;display:flex;align-items:center;justify-content:center;padding:14px}.modal .card{max-width:440px;width:100%;margin:0}
.strip{background:#fff8e1;border-bottom:1px solid #e6c65c;font-size:12.5px;text-align:center;padding:4px 8px;color:#6b4e00}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.code{font-size:26px;letter-spacing:4px;font-weight:700;font-family:ui-monospace,Menlo,monospace}
.cl{border-left:4px solid var(--g);padding:6px 10px;margin:8px 0;background:#fff}
.cl b{color:var(--g)}.tool{background:#e1edfa;border-radius:8px;padding:6px 10px;font-size:13px;margin-top:4px}
.pii{background:#fff8e1;border-radius:6px;padding:0 4px}

.fab{position:fixed;right:12px;bottom:78px;z-index:9000;display:flex;gap:8px}.fab-b{background:var(--g);color:#fff;border:0;border-radius:24px;padding:11px 16px;font:inherit;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}
.chat{position:fixed;right:12px;bottom:132px;z-index:9100;width:min(390px,calc(100vw - 24px))}.chat-in{background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:min(62vh,520px)}
.ch-h{display:flex;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd)}.ch-h .sp{flex:1}.ch-b{overflow:auto;padding:8px 12px;flex:1;min-height:120px}.ch-s{display:flex;gap:6px;overflow-x:auto;padding:6px 12px}.ch-f{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--bd)}.ch-f input{flex:1;margin:0}
.chip{white-space:nowrap;background:var(--g2);border:1px solid var(--bd);border-radius:16px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--tx)}
.bd{background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;font-style:normal;font-weight:700}
body{padding-bottom:130px}
.nbar{position:sticky;top:0;z-index:30;display:flex;gap:8px;padding:6px 12px;background:var(--bg,#fff);border-bottom:1px solid var(--bd,#ddd)}
.pn{display:flex;gap:10px;justify-content:space-between;margin:22px 0 8px}.pn .btn{flex:1;max-width:48%;line-height:1.25}.pn small{opacity:.85}.eye{margin:4px 0 8px}
</style>
</head>
<body>
<a class="skip" href="#app">Skip to content</a>
<div class="strip" id="strip"></div>
<header id="hd"></header>
<main id="app" tabindex="-1"></main>
<nav class="bot" id="nv" aria-label="Sections"></nav>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="fab"></div><div id="chat" class="chat" hidden></div>
<script>
'use strict';
/* CoopVault v13 · Stage 1 — rules, roles, access, footprints, two-step login.
   Browser-only trial: data lives in THIS browser. Use test data only. */
const BUILD='v13.18 · payslip reviewed by Credit · 24 Nov 2026', KEY='coopvault_v13';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null;
const NOW=()=>Date.now()+((S&&S.clock)||0);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const fmt=t=>t?new Date(t).toLocaleString('en-KE',{dateStyle:'medium',timeStyle:'short'}):'—';
const enc=new TextEncoder();
const b64=u8=>btoa(String.fromCharCode(...u8)), unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));

/* ---------- SHA-256 (sync, for the audit chain) ---------- */
const SHA=(()=>{const K=[],H0=[];let n=2,c=0;
 while(c<64){let p=1;for(let i=2;i*i<=n;i++)if(n%i===0){p=0;break}
  if(p){if(c<8)H0.push(Math.floor((Math.sqrt(n)%1)*4294967296));K.push(Math.floor((Math.cbrt(n)%1)*4294967296));c++}n++}
 return s=>{const b=enc.encode(s),l=b.length,pl=((l+9+63)>>6)<<6,m=new Uint8Array(pl);m.set(b);m[l]=128;
  const dv=new DataView(m.buffer);dv.setUint32(pl-4,(l*8)>>>0);dv.setUint32(pl-8,Math.floor(l*8/4294967296));
  const h=H0.slice(),w=new Array(64);
  for(let o=0;o<pl;o+=64){
   for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
   for(let i=16;i<64;i++){const a=w[i-15],d=w[i-2];
    const z0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3),z1=((d>>>17)|(d<<15))^((d>>>19)|(d<<13))^(d>>>10);
    w[i]=(w[i-16]+z0+w[i-7]+z1)>>>0}
   let [a,b2,c2,d2,e,f,g,hh]=h;
   for(let i=0;i<64;i++){
    const Z1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)),ch=(e&f)^(~e&g),t1=(hh+Z1+ch+K[i]+w[i])>>>0,
     Z0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)),mj=(a&b2)^(a&c2)^(b2&c2),t2=(Z0+mj)>>>0;
    hh=g;g=f;f=e;e=(d2+t1)>>>0;d2=c2;c2=b2;b2=a;a=(t1+t2)>>>0}
   const v=[a,b2,c2,d2,e,f,g,hh];for(let i=0;i<8;i++)h[i]=(h[i]+v[i])>>>0}
  return h.map(x=>x.toString(16).padStart(8,'0')).join('')}})();

/* ---------- PIN hashing (PBKDF2), TOTP (RFC 6238), backups (AES-GCM) ---------- */
async function pbk(pin,saltB64){const k=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
 return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(saltB64),iterations:100000,hash:'SHA-256'},k,256)))}
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32enc(u8){let bits=0,v=0,o='';for(const x of u8){v=((v<<8)|x)&0xfffff;bits+=8;while(bits>=5){o+=B32[(v>>>(bits-5))&31];bits-=5}}if(bits>0)o+=B32[(v<<(5-bits))&31];return o}
function b32dec(s){let bits=0,v=0;const o=[];for(const ch of s){v=((v<<5)|B32.indexOf(ch))&0xfffff;bits+=5;if(bits>=8){o.push((v>>>(bits-8))&255);bits-=8}}return new Uint8Array(o)}
async function totp(secret,t=Date.now()){const buf=new ArrayBuffer(8);new DataView(buf).setUint32(4,Math.floor(t/30000));
 const k=await crypto.subtle.importKey('raw',b32dec(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);
 const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,buf)),o=h[19]&15;
 return String((((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1000000).padStart(6,'0')}
async function okTotp(secret,code){code=String(code||'').replace(/\s/g,'');if(!/^\d{6}$/.test(code))return false;
 for(const d of [-30000,0,30000])if(await totp(secret,Date.now()+d)===code)return true;return false}
async function aesKey(pass,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

/* ---------- Rules: the Loan Policy (2009) and By-laws as editable settings ---------- */
const DEF={
 minMonths:{v:6,label:'Months of membership before a loan',ref:'Loan Policy 1(b)'},
 minSavings:{v:12000,label:'Minimum savings before a loan (KSh)',ref:'Loan Policy 1(b)'},
 monthlySaving:{v:2000,label:'Minimum monthly savings (KSh)',ref:'Loan Policy 1(b)(ii)'},
 entranceFee:{v:1000,label:'Entrance fee, once (KSh)',ref:'Loan Policy 1(b)(iii); By-law 9.1'},
 readmitFee:{v:1200,label:'Re-admission fee, non-refundable (KSh)',ref:'Loan Policy 1(c)'},
 shareValue:{v:20,label:'Value of one share (KSh)',ref:'By-law 22.1(b)'},
 minShares:{v:250,label:'Minimum shares per member',ref:'By-law 23'},
 transferFee:{v:500,label:'Share transfer fee (KSh)',ref:'By-law 24(b)'},
 holdMonths:{v:3,label:'Months lump-sum savings must stay before counting',ref:'Loan Policy 1(d),(e)'},
 loanMult:{v:3,label:'Loan limit as multiple of savings',ref:'Loan Policy 13'},
 capPct:{v:20,label:'Cap per loan, % of share capital and reserves (policy allows 20, 15 or 1/5)',ref:'Loan Policy 13'},
 deductPct:{v:66.67,label:'Maximum total deductions, % of gross salary',ref:'Loan Policy 13, 22'},
 maxMonths:{v:36,label:'Maximum repayment period (months)',ref:'Loan Policy 21(a)'},
 rate:{v:1.5,label:'Interest per month, declining balance (%)',ref:'Loan Policy 7'},
 borrowedSurcharge:{v:2,label:'Extra interest when the money is borrowed (%)',ref:'Loan Policy 7'},
 guarantors:{v:5,label:'Guarantors per loan',ref:'Loan Policy 26(a)'},
 maxGuarantees:{v:5,label:'Most loans one member may guarantee',ref:'Loan Policy 27'},
 cashReservePct:{v:10,label:'Cash reserve, % of members’ savings',ref:'Loan Policy 14'},
 reserveDepositPct:{v:50,label:'Share of cash reserve kept in deposit account (%)',ref:'Loan Policy 14'},
 withdrawNoticeDays:{v:90,label:'Withdrawal notice (working days)',ref:'Loan Policy 24(c), 30'},
 withdrawFee:{v:5000,label:'Deduction on withdrawal (KSh)',ref:'Loan Policy 30(i)'},
 arrearsMonths:{v:3,label:'Months in arrears before guarantors are called',ref:'Loan Policy 35; By-law 72(c)'},
 maxFine:{v:20000,label:'Largest fine (KSh)',ref:'By-law 75'},
 reservePct:{v:20,label:'Share of surplus to reserve fund (%)',ref:'By-law 29, 65'},
 groupMax:{v:10,label:'Most members in a group',ref:'Decision of the society'},
 groupMin:{v:3,label:'Fewest members in a group (editable; assumed)',ref:'Assumption — confirm'},
 idleMinutes:{v:5,label:'Log out after idle minutes',ref:'Security'},
 lockAfter:{v:5,label:'Wrong PIN tries before lock',ref:'Security'},
 reserves:{v:0,label:'Reserves recorded (KSh), used for the loan cap until the books arrive',ref:'Loan Policy 13'},
 borrowedFunds:{v:false,label:'Society is lending borrowed money (adds the extra interest)',ref:'Loan Policy 7'},
 trialOtp:{v:true,label:'Trial mode: show the one-time code on screen (turn OFF for real use)',ref:'Security'}
};
const P=k=>(S.set&&k in S.set)?S.set[k]:DEF[k].v;

/* ---------- Policy and By-laws library (plain-language summary with clause numbers) ---------- */
const CL=[
['LP','1(a)','Funds must be available','A loan can only be granted when the society has adequate funds for lending.'],
['LP','1(b)','Who qualifies','At least 6 months in membership and at least KSh 12,000 saved, for normal, emergency and school fees loans. Minimum saving is KSh 2,000 a month. The entrance fee is KSh 1,000, paid once.'],
['LP','1(c)','Re-joining','A member who withdraws and rejoins is treated as new and pays a non-refundable re-admission fee of KSh 1,200.'],
['LP','1(d)-(e)','Savings that count','Savings paid in cash or cheque to secure a loan must stay with the society 3 months. Check-off savings above one third of basic salary also stay 3 months before they count.'],
['LP','1(g)','Pledge of income','The member undertakes to pledge future income and benefits towards repayment.'],
['LP','2','How to apply','Fill the loan form and give it to the Credit Committee. Credit checks eligibility, then issues a serialised application and agreement form that is entered in the loan register.'],
['LP','3','Who approves','Loans are approved by the Credit Committee, subject to final approval by the full Management Committee. A member never takes part where their own loan is considered. The Executive may approve emergency loans, subject to ratification.','In CoopVault: Credit approves, the Executive approves the monies, the Manager disburses, and each Executive approval is listed for ratification.'],
['LP','4','Employees','Employees of the society may be members but cannot sit on the Management Committee or any sub-committee.'],
['LP','6','Tampering','Tampering with monthly contributions or loan repayment can lead to dismissal and prosecution.'],
['LP','7','Interest','Not more than 1.5% a month on the declining balance, unless a General Meeting resolves otherwise. If the society borrowed the money, a further 2% may be added.'],
['LP','8','One society; retirees','No one may belong to more than one SACCO. A retiree who stays a member can borrow only up to their savings.'],
['LP','9-10','Forms and honesty','The form must be complete with a current payslip. Applicants declare their other debts. False information about savings, guarantees or a guarantor’s ability is an offence.'],
['LP','11','Order of loans','Loans are taken in the order received. If money is short, smaller loans come first, then shorter periods, then members who never had a loan.'],
['LP','12','Loan purposes','Productive loans (development, long term) and provident loans (school fees and emergency, not overseas college fees).'],
['LP','13','Maximum loan','Not more than 3 times savings, and within 20%, 15% or one fifth of the society’s share capital and reserves. Total deductions including the loan must not exceed two thirds of gross salary.'],
['LP','14','Cash reserve','The society keeps liquid funds equal to 10% of members’ savings. At least half is held in a deposit account and is not lent.'],
['LP','16','Top-up','A second or top-up loan needs funds, eligibility, and approval of the full Management Committee and Supervisory Committee.'],
['LP','17','Emergency loans','Sudden hospitalisation, funeral, and others the committee decides. Given within the member’s entitlement.'],
['LP','18','School fees loans','Allowed even with another loan, if all loans stay within 3 times savings. Repaid within the same calendar year. Not for overseas colleges. Needs the admission or transfer letter and the fee structure.'],
['LP','19','Interdicted members','A member on interdiction may borrow up to their savings only.'],
['LP','21','Repayment period','Not more than 36 months. Deductions start no later than the month after payout.'],
['LP','22-23','Ability to repay','No member suffers deductions over two thirds of gross income. Credit assesses income and Management approves it. Other income is not counted. Early full or part repayment is allowed. A member cannot withdraw while a loan is outstanding.'],
['LP','24','Transfer to another SACCO','Allowed when loans are cleared, by cheque to the new society, with 90 working days notice.'],
['LP','25','Pledged savings','Savings pledged for another member’s loan are not refunded unless the borrower provides another guarantor.'],
['LP','26','Guarantors','Every loan needs at least 5 guarantors whose total savings equal the loan. Members of the Management and Supervisory Committees cannot guarantee loans. Committee members can still borrow, and other members can guarantee them.'],
['LP','27','Guarantee limit','No member may guarantee more than 5 loans.'],
['LP','28-29','Changing guarantors; other security','Guarantors’ duty ends when new guarantors are accepted or the loan is paid. The society also accepts logbooks, title deeds and insurance surrender value; the member pays valuation and legal costs.'],
['LP','30-31','Withdrawal','Written notice of 90 working days with reasons. KSh 5,000 is deducted. No withdrawal while you owe the society or until your guaranteed loans are repaid or replaced.'],
['LP','33-34','Contract staff; non-Kenyans','Loans to contract staff must be repayable within the contract period. Loans to non-Kenyans are not considered.'],
['LP','35','If a loan is not repaid','After 1 month: written notice to the borrower, copied to guarantors. After the 2nd month: guarantors are told they will be called. After 3 consecutive months: guarantors honour their obligation. The society may also recover from other benefits.'],
['LP','36','Changes','Any change to share contributions, repayments or interest must be authorised by the Management Committee.'],
['BL','7','Who may join','Employees of the society’s common-bond employer, aged 18 or more, of good character, who pay the entrance fee and share capital. No one may belong to two similar SACCOs.'],
['BL','9','Admission','Entrance fee KSh 1,000 plus minimum shares. The committee admits, subject to confirmation by the next General Meeting. The member signs the register accepting the by-laws.'],
['BL','16','Suspension and expulsion','30 days written notice and a defence, an inquiry decided within 15 days, appeal to the General Meeting, then the Tribunal.'],
['BL','17-18','Leaving','Notice in writing (the society applies the 90 working days of the Loan Policy). On leaving, dividends, interest and other sums are refunded after deducting what is owed.'],
['BL','19-21','Nominees','Each member names one or two nominees, witnessed by two members. On death the nominee receives deposits, interest and dividends after debts, and may be admitted as a member.'],
['BL','23-24','Shares','Shares are KSh 20 each, minimum 250. No member holds more than one fifth of all shares. Shares move only to another member, at nominal value, with a KSh 500 fee.'],
['BL','27','Receipts','Every payment to the society is evidenced by a printed receipt that names the member.'],
['BL','29, 65','Surplus','One fifth of net surplus goes to the reserve fund. The General Meeting decides the rest: dividends and interest, education fund, honoraria, other uses.'],
['BL','48','Executive officers','Chairman, Vice-Chairman, Treasurer and Honorary Secretary.'],
['BL','54','Education Committee','Three members; the Vice-Chairman is its chairman. Organises education for members, officers, staff and the public.'],
['BL','56','Credit Committee','Three members of the committee, none an executive officer. Vets applicants and guarantors, helps members with financial problems, keeps records, and forwards recommendations.'],
['BL','57-58','Supervisory Committee','Three members elected for three years. Checks internal controls, reconciliations and the trend of recoveries; reports to the committee, the General Meeting and the Commissioner. Does not do the committee’s work.'],
['BL','63','Signing','Documents and cheques are signed by any three of the Chairman, Vice-Chairman, Secretary and Treasurer. The Manager countersigns.'],
['BL','68(d)','Loans to officers and staff','Allowed on the same terms as others, approved by Credit and then the Committee. The applicant takes no part in the decision.'],
['BL','69','Security','Member’s deposits, guarantors’ deposits and other collateral. A member may ask the committee to change guarantors.'],
['BL','72','Overdue loans','At every committee meeting the Treasurer presents the list of delinquent borrowers. Loans overdue more than 3 months go to the guarantors with notice. Disputes go to the Tribunal. Defaulters may be listed with a Credit Reference Bureau after notice.'],

const K=n=>'KSh '+Math.round(Number(n)||0).toLocaleString('en-KE');
const MS_MONTH=2629800000;
const COMMITTEE=['mgmt','credit','edu','sup'];
const OPEN=['draft','guarantors','manager','credit','returned','exec','disburse','appeal'];
const sumTx=(mid,kind)=>S.tx.filter(x=>x.mid===mid&&x.kind===kind).reduce((a,x)=>a+x.amt,0);
const savingsOf=mid=>sumTx(mid,'saving'), sharesOf=mid=>sumTx(mid,'share');
const activeLoans=mid=>S.loans.filter(l=>l.mid===mid&&l.status==='active');
const outstanding=mid=>activeLoans(mid).reduce((a,l)=>a+l.bal,0);
const rateOf=()=>P('rate')+(P('borrowedFunds')?P('borrowedSurcharge'):0);
const inst=(p,n,r)=>{r=r/100;return r===0?p/n:p*r/(1-Math.pow(1+r,-n))};
const addMonths=(t,n)=>{const d=new Date(t);d.setMonth(d.getMonth()+n);return d.getTime()};
const pledges=mid=>{let c=0,sum=0;S.loans.forEach(l=>{if(OPEN.includes(l.status)||l.status==='active')l.g.forEach(g=>{if(g.mid===mid&&(g.st==='accepted'||g.st==='asked')){c++;sum+=g.pledge}})});return{c,sum}};
const freeSavings=mid=>savingsOf(mid)-pledges(mid).sum;
const isCommittee=u=>(u.roles||[]).some(r=>COMMITTEE.includes(r));
function fund(){const ms=S.users.filter(u=>u.roles.includes('member')),sv=ms.reduce((a,m)=>a+savingsOf(m.id),0),sh=ms.reduce((a,m)=>a+sharesOf(m.id),0),out=S.loans.filter(l=>l.status==='active').reduce((a,l)=>a+l.bal,0),reserve=sv*P('cashReservePct')/100;
 return{sv,sh,out,reserve,lendable:Math.max(0,sv+sh-reserve-out)}}
function monthsLate(l){if(l.status!=='active')return 0;const n=l.months,i=l.inst;let due=0;for(let k=1;k<=n;k++)if(addMonths(l.disb.t,k)<=NOW())due++;
 const expect=Math.min(due*i,l.total),short=expect-l.paid;return short>1?Math.ceil(short/i-1e-9):0}
function elig(m,type,amt,months,exceptId){const out=[],add=(ok,txt,ref)=>out.push({ok:!!ok,txt,ref});
 const jm=(NOW()-m.joined)/MS_MONTH,sv=savingsOf(m.id),os=outstanding(m.id);amt=Number(amt)||0;months=Number(months)||0;
 add(jm>=P('minMonths'),`In membership ${jm.toFixed(1)} months (need ${P('minMonths')})`,'Loan Policy 1(b)');
 add(sv>=P('minSavings'),`Savings ${K(sv)} (need ${K(P('minSavings'))})`,'Loan Policy 1(b)');
 add(m.kenyan!==false,'Kenyan citizen','Loan Policy 34');
 add(!S.loans.some(l=>l.mid===m.id&&l.status==='active'&&monthsLate(l)>0),'No loan of yours is behind','Loan Policy 35');
 add(!S.loans.some(l=>l.mid===m.id&&OPEN.includes(l.status)&&l.id!==exceptId),'No other application of yours is still open','Loan Policy 15');
 add(amt>0&&amt+os<=P('loanMult')*sv,`Loan ${K(amt)} + existing ${K(os)} within ${P('loanMult')} × savings (${K(P('loanMult')*sv)})`,type==='school'?'Loan Policy 18(a)':'Loan Policy 13');
 const base=fund().sh+0,cap=P('capPct')/100*(fund().sh+P('reserves'));
 add(cap>0&&amt<=cap,cap>0?`Loan within ${P('capPct')}% of share capital and reserves (${K(cap)})`:'Share capital and reserves are not recorded yet (Manager and Administrator must record them)','Loan Policy 13');
 const gross=Number(m.gross)||0,ex=activeLoans(m.id).reduce((a,l)=>a+l.inst,0),ni=amt&&months?inst(amt,months,rateOf()):0;
 add(gross>0&&ex+ni<=gross*P('deductPct')/100,gross>0?`Deductions ${K(ex+ni)} within ${P('deductPct')}% of gross pay (${K(gross*P('deductPct')/100)})`:'Gross pay is not recorded yet (the Manager records it from your payslip)','Loan Policy 13, 22');
 let maxM=P('maxMonths');if(type==='school'){maxM=Math.min(maxM,11-new Date(NOW()).getMonth())}
 if(m.contractEnd){maxM=Math.min(maxM,Math.max(0,Math.floor((new Date(m.contractEnd)-NOW())/MS_MONTH)))}
 add(months>=1&&months<=maxM,`Repayment ${months||'—'} months (this loan may run up to ${maxM})`,type==='school'?'Loan Policy 18(b)':m.contractEnd?'Loan Policy 33':'Loan Policy 21');
 if(m.restricted)add(amt+os<=sv,`${m.restricted==='retiree'?'Retiree':'Interdicted member'}: loans only up to savings (${K(sv)})`,m.restricted==='retiree'?'Loan Policy 8(b)':'Loan Policy 19');
 return out}

ACT.createLoan=async()=>{const u=U(),w=ui.ln,n=P('guarantors');needRole('member');

 if(gs.some(g=>!g.mid))throw new Error('Choose all '+n+' guarantors.');if(new Set(gs.map(g=>g.mid)).size!==n)throw new Error('Each guarantor must be a different member.');
 if(gs.reduce((a,g)=>a+g.pledge,0)<amt)throw new Error('The pledges together must cover the whole loan.');
 for(const g of gs)if(!canGuarantee(user(g.mid),g.pledge,u.id))throw new Error('One of your guarantors cannot cover that pledge. Try a smaller pledge or choose another member.');
 const l={id:uid(),ref:nextNo('l'),mid:u.id,type:w.type,amount:amt,months:Number(w.months),purpose:w.purpose.trim(),rate:rateOf(),status:'draft',t:NOW(),g:gs.map(g=>({...g,st:'draft',reason:''})),hist:[],msgs:[],cv:[],es:[],gl:w.gl||null};
 l.inst=Math.round(inst(l.amount,l.months,l.rate));l.total=l.inst*l.months;l.bal=0;l.paid=0;S.loans.push(l);
 if(w.gl){const gl=S.gloans.find(x=>x.id===w.gl);gl.lines.find(x=>x.mid===u.id).loanId=l.id}
 hist(l,'Prepared');log('loan.create','loan',l.id,null,{amount:l.amount,type:l.type});ui.loanId=l.id;ui.view='loan';ui.ln=null};

 const cr=creditElig(l),ex=execElig(l),cv=l.cv.reduce((o,v)=>{o[v.v]=(o[v.v]||0)+1;return o},{}),es=l.es.reduce((o,v)=>{o[v.v]=(o[v.v]||0)+1;return o},{});

  if(l.status==='guarantors')act+=`<div class="card"><p>Waiting for your guarantors. You can replace or change a pledge in the list above.</p><button class="btn sec" data-act="cancelLoan" data-a="${l.id}">Cancel this application</button></div>`;
  if(l.status==='declined')act+=`<div class="card"><h3>This loan was declined</h3><p>${esc(l.hist.slice().reverse().find(h=>h.act==='Declined')?.note||'')}</p>${l.appealed?'<p class="muted">You already appealed.</p>':`<form data-form="appeal" data-id="${l.id}"><label for="ar">Why should it be reconsidered? (By-law 16 and your right to be heard)</label><textarea id="ar" name="reason" rows="2" required></textarea><button class="btn">Appeal to the Management Committee</button></form>`}</div>`;
  if(['cleared','declined'].includes(l.status)&&!l.rating)act+=`<div class="card"><h3>How did we do?</h3><form data-form="rate" data-id="${l.id}" class="row"><select name="s"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><input name="c" placeholder="Comment (optional)"><button class="btn sm">Send rating</button></form></div>`;
  if(l.gl){const gl=S.gloans.find(x=>x.id===l.gl);if(l.status==='active'&&gl&&!l.ack)act+=`<div class="card"><h3>Group loan: confirm you received your part</h3><p>All members must sign off the loan as received.</p><button class="btn" data-act="ack" data-a="${l.id}">I confirm I received ${K(l.amount)}</button></div>`}}
 if(r==='manager'&&l.status==='manager'){const ds=docsOf('loanId',l.id),pay=ds.find(d=>d.kind==='payslip');
  act+=`<div class="card"><h3>Manager check (Loan Policy 9, 10)</h3><div class="chk ${pay?'y':''}">Payslip attached</div><div class="chk ${pay&&pay.st==='verified'?'y':''}">Payslip verified</div><div class="chk ${Number(b.gross)>0?'y':''}">Gross pay recorded: ${b.gross?K(b.gross):'not yet (open the member and record it from the payslip)'}</div>${l.type==='school'?`<div class="chk ${ds.some(d=>d.kind==='admission'&&d.st==='verified')&&ds.some(d=>d.kind==='fees'&&d.st==='verified')?'y':''}">School letter and fee structure verified</div>`:''}
  <form data-form="mgrDecide" data-id="${l.id}"><input name="note" placeholder="Note to Credit, or reason if returning"><button class="btn" name="d" value="pass">Send to Credit Committee</button><button class="btn sec" name="d" value="return">Return to member</button></form></div>`}
 if(r==='credit'&&['credit'].includes(l.status)){const nd=needN(cr.length,3);
  act+=`<div class="card"><h3>Credit Committee decision</h3>${cr.some(x=>x.id===u.id)?'':'<p class="demo">You cannot vote on this loan.</p>'}<p>Votes: approve ${cv.approve||0}, decline ${cv.decline||0}, return ${cv.return||0}. Needed: ${nd} of ${cr.length} eligible voters.</p>${myCv?`<p class="muted">Your vote: ${esc(myCv.v)}</p>`:''}
  <h4>Eligibility check (now)</h4>${elig(b,l.type,l.amount,l.months,l.id).map(c=>`<div class="chk ${c.ok?'y':''}">${esc(c.txt)}</div>`).join('')}
  ${cr.some(x=>x.id===u.id)?`<form data-form="creditVote" data-id="${l.id}"><input name="note" placeholder="Comment (needed to decline or return)"><button class="btn" name="d" value="approve">Approve</button><button class="btn sec" name="d" value="return">Return to member</button><button class="btn danger" name="d" value="decline">Decline</button></form>`:''}</div>`}
 if(r==='mgmt'&&l.status==='exec'&&OFFICERS.includes(u.officer)){const nd=Math.max(1,Math.min(3,ex.length));
  act+=`<div class="card"><h3>Executive approval of the monies (By-law 63)</h3>${ex.some(x=>x.id===u.id)?'':'<p class="demo">You cannot sign this loan.</p>'}<p>Credit recommended approval. Signatures: ${(es.sign||0)}, refusals ${(es.refuse||0)}. Needed: ${nd} of ${ex.length}.</p>${myEs?`<p class="muted">You: ${esc(myEs.v)}</p>`:''}${ex.some(x=>x.id===u.id)?`<form data-form="execSign" data-id="${l.id}"><input name="note" placeholder="Reason (needed to refuse)"><button class="btn" name="d" value="sign">Sign</button><button class="btn danger" name="d" value="refuse">Refuse</button></form>`:''}</div>`}
 if(r==='manager'&&l.status==='disburse'){const f=fund();act+=`<div class="card"><h3>Disburse (Manager)</h3><p>Funds the society can lend now: <b>${K(f.lendable)}</b> (after the ${P('cashReservePct')}% cash reserve, Loan Policy 14). The cheque or transfer needs the officers’ signatures and your countersignature (By-law 63).</p><p>Member’s confirmed payout account: ${destLine(l)}</p>${l.gl?'<p class="demo">This is part of a group loan. Disburse it from the Groups part of the Loan desk.</p>':`<form data-form="disburse" data-id="${l.id}"><label for="dm">Method</label><select id="dm" name="m"><option>M-Pesa</option><option>Bank transfer</option><option>Cheque</option></select>${fld('ref','Reference (transaction or cheque number)','text','required')}<button class="btn">Confirm payout</button></form>`}</div>`}
 if(r==='manager'&&l.status==='active')act+=`<div class="card"><h3>Record a repayment</h3><form data-form="repay" data-id="${l.id}">${fld('amt','Amount (KSh)','number','min="1" required value="'+l.inst+'"')}<label for="rm">Method</label><select id="rm" name="m"><option>Payroll check-off</option><option>M-Pesa</option><option>Bank</option><option>Cash</option></select>${fld('ref','Reference','text','required')}<button class="btn">Post and issue receipt</button></form></div>`;
 const money=['active','cleared'].includes(l.status)?`<div class="card"><h3>Repayment</h3><p>Instalment <b>${K(l.inst)}</b> × ${l.months} · Balance <b>${K(l.bal)}</b> · Paid ${K(l.paid)} ${late?badge(late+' month(s) behind','bad'):badge('Up to date','ok')}</p>${S.tx.filter(x=>x.loanId===l.id).map(x=>`<p class="small">${fmt(x.t)} · ${K(x.amt)} (${esc(x.receipt||'')}) ${x.kind==='disburse'?'paid out':'interest '+K(x.int)+', principal '+K(x.prin)}</p>`).join('')}</div>`:'';
 const msgs=`<div class="card"><h3>Questions and answers</h3>${l.msgs.map(m=>`<div class="bub ${m.uid===u.id?'me':'bot'}"><b>${esc(m.who)}</b> <span class="muted small">${fmt(m.t)}</span><br>${esc(m.text)}</div>`).join('')||'<p class="muted">None.</p>'}${(owner||r==='manager'||r==='credit')?`<form data-form="loanMsg" data-id="${l.id}" class="row"><input name="text" placeholder="${owner?'Ask the loan desk a question':'Reply'}" required><button class="btn sm">Send</button></form>`:''}</div>`;

 <div class="card">${stepper(l)}<p><b>${esc(b.name)}</b> · ${esc(TYPES[l.type])} · ${l.months} months · ${l.rate}% a month · instalment ${K(l.inst)}<br>${esc(l.purpose)}</p>${l.gl?'<span class="badge info">Part of a group loan (own liability only)</span>':''}</div>
 ${act}
 ${a==='guarantor'?`<div class="card"><p>You pledged <b>${K((l.g.find(g=>g.mid===u.id)||{}).pledge)}</b> for this loan. Status: ${sb(l)}${late?' '+badge(late+' month(s) behind','bad'):''}</p></div>`:`<div class="card"><h3>Guarantors</h3><div class="tw"><table><tr><th>Name</th><th>Pledge</th><th>Answer</th><th></th></tr>${gview}</table></div></div>`}

const mustOwn=l=>{if(ui.role!=='member'||l.mid!==ui.uid)throw new Error('This is not your loan.')};
const L=id=>{const l=S.loans.find(x=>x.id===id);if(!l)throw new Error('Loan not found.');return l};
FORMS.docUp=async(f,el,fd)=>{const l=L(el.dataset.id);mustOwn(l);const file=fd.get('file'),data=await readFile(file);
 S.docs.push({id:uid(),loanId:l.id,owner:l.mid,kind:f.kind,name:file.name,size:file.size,data,st:'uploaded',reason:'',t:NOW(),by:ui.uid});log('doc.upload','document',l.id,null,{kind:f.kind,name:file.name})};
ACT.getDoc=async id=>{const d=S.docs.find(x=>x.id===id);if(!d)return;const l=d.loanId?S.loans.find(x=>x.id===d.loanId):null;
 if(!(d.owner===ui.uid||['manager','credit','sup'].includes(ui.role)||(ui.role==='mgmt'&&OFFICERS.includes(U().officer))))throw new Error('You cannot open this document.');
 if(d.owner!==ui.uid)log('view','document',d.id,null,null,d.name);const b=await (await fetch(d.data)).blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=d.name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
FORMS.docDecide=async(f,el)=>{needRole('manager');const d=S.docs.find(x=>x.id===el.dataset.id);if(f.d==='rejected'&&!f.reason.trim())throw new Error('Give the reason for rejecting.');
 d.st=f.d;d.reason=f.reason||'';log('doc.'+f.d,'document',d.id,null,null,f.reason);d.owner&&notify(d.owner,'Document '+f.d,DOCK[d.kind]+': '+f.d+(f.reason?'. '+f.reason:''))};
ACT.submitLoan=async id=>{const l=L(id);mustOwn(l);if(!docsOf('loanId',l.id).some(d=>d.kind==='payslip'))throw new Error('Attach your current payslip first (Loan Policy 9).');
 if(l.type==='school'&&!(docsOf('loanId',l.id).some(d=>d.kind==='admission')&&docsOf('loanId',l.id).some(d=>d.kind==='fees')))throw new Error('A school fees loan needs the admission or transfer letter and the fee structure (Loan Policy 18).');
 if(l.status==='returned'){l.status='manager';hist(l,'Resubmitted');notifyRole('manager','Loan resubmitted',l.ref);return}
 l.g.forEach(g=>{if(g.st==='draft'){g.st='asked';g.t=NOW();notify(g.mid,'Guarantee request',lname(l.mid)+' asks you to guarantee '+K(l.amount)+'. Open Loans to answer.')}});l.status='guarantors';hist(l,'Sent to guarantors');log('loan.submit','loan',l.id);advance(l)};
function advance(l){if(l.status==='guarantors'&&l.g.every(g=>g.st==='accepted')&&l.g.reduce((a,g)=>a+g.pledge,0)>=l.amount){l.status='manager';hist(l,'All guarantors accepted');notifyRole('manager','Loan ready for checking',l.ref+' · '+lname(l.mid));notify(l.mid,'Guarantors complete',l.ref+' is now with the Manager.')}}
FORMS.gResp=async(f,el)=>{const l=L(el.dataset.id),i=+el.dataset.i,g=l.g[i];if(g.mid!==ui.uid||g.st!=='asked')throw new Error('That request is not for you.');
 if(f.d==='decline'){if(!f.reason.trim())throw new Error('Please give a short reason.');g.st='declined';g.reason=f.reason;hist(l,'Guarantor declined',lname(g.mid)+': '+f.reason);notify(l.mid,'A guarantor declined',lname(g.mid)+' declined. '+f.reason+' Choose another guarantor.');log('guarantee.decline','loan',l.id,null,null,f.reason);return}
 const amt=Number(f.amt);if(!(amt>0)||amt>g.pledge)throw new Error('Enter an amount up to '+K(g.pledge)+'.');
 if(!canGuarantee(U(),amt,l.mid,l.id))throw new Error('You cannot pledge that amount: you may be at the limit of '+P('maxGuarantees')+' guarantees or lack enough free savings.');
 const less=amt<g.pledge;g.pledge=amt;g.st='accepted';g.reason=less?(f.reason||'Pledged less'):'';hist(l,less?'Guarantor accepted a smaller pledge':'Guarantor accepted',lname(g.mid)+' '+K(amt));log('guarantee.accept','loan',l.id,null,{pledge:amt});
 notify(l.mid,'Guarantor accepted',lname(g.mid)+' pledged '+K(amt)+(less?'. It is less than asked: please cover the gap.':'.'));
 if(l.g.every(x=>x.st==='accepted')&&l.g.reduce((a,x)=>a+x.pledge,0)<l.amount)notify(l.mid,'Pledges are short',l.ref+': pledges are '+K(l.amount-l.g.reduce((a,x)=>a+x.pledge,0))+' short. Replace a guarantor or change a pledge.');advance(l)};
FORMS.gSwap=async(f,el)=>{const l=L(el.dataset.id),i=+el.dataset.i;mustOwn(l);if(!['draft','guarantors','returned'].includes(l.status))throw new Error('Too late to change guarantors here.');
 const g=l.g[i],nm=f.m||g.mid,p=Number(f.p)||g.pledge;if(l.g.some((x,j)=>j!==i&&x.mid===nm))throw new Error('That member is already a guarantor.');
 if(!canGuarantee(user(nm),p,l.mid,l.id))throw new Error('One of your guarantors cannot cover that pledge. Try a smaller pledge or choose another member.');
 const old=g.mid;g.mid=nm;g.pledge=p;g.st=l.status==='draft'?'draft':'asked';g.reason='';g.t=NOW();hist(l,'Guarantor changed','slot '+(i+1));log('guarantee.change','loan',l.id,{mid:old},{mid:nm});
 if(g.st==='asked')notify(nm,'Guarantee request',lname(l.mid)+' asks you to guarantee '+K(l.amount)+'. Your share: '+K(p));if(l.status==='returned')l.status='guarantors'};
ACT.remind=(id,i)=>{const l=L(id),g=l.g[+i];mustOwn(l);notify(g.mid,'Reminder: guarantee request',lname(l.mid)+' is waiting for your answer on '+K(l.amount));hist(l,'Reminder sent',lname(g.mid));toast('Reminder sent.')};
ACT.cancelLoan=id=>{const l=L(id);mustOwn(l);if(!['draft','guarantors','returned'].includes(l.status))throw new Error('It is already with the committee. Ask the Manager.');l.status='cancelled';hist(l,'Cancelled by member');log('loan.cancel','loan',l.id);l.g.forEach(g=>{if(g.st==='asked')notify(g.mid,'Request withdrawn',lname(l.mid)+' cancelled the loan request.')});ui.view='loans'};
FORMS.loanMsg=async(f,el)=>{const l=L(el.dataset.id),a=loanAccess(l);if(a==='none'||a==='guarantor')throw new Error('Not allowed.');if(ui.role==='sup'||ui.role==='mgmt')throw new Error('Not allowed.');
 l.msgs.push({uid:ui.uid,who:U().name+' ('+ROLES[ui.role]+')',t:NOW(),text:f.text});log('loan.msg','loan',l.id);
 if(ui.role==='member')notifyRole('manager','Question on '+l.ref,f.text.slice(0,80));else notify(l.mid,'Reply on '+l.ref,f.text.slice(0,120))};
FORMS.mgrDecide=async(f,el)=>{needRole('manager');const l=L(el.dataset.id);if(l.status!=='manager')throw new Error('Not at this stage.');const ds=docsOf('loanId',l.id);
 if(f.d==='pass'){if(!ds.some(d=>d.kind==='payslip'))throw new Error('The member has not attached a payslip.');if(!(Number(user(l.mid).gross)>0))throw new Error('Record the gross pay from the payslip on the member’s page first.');
  if(l.type==='school'&&!(ds.some(d=>d.kind==='admission'&&d.st==='verified')&&ds.some(d=>d.kind==='fees'&&d.st==='verified')))throw new Error('Verify the school letter and fee structure.');
  l.status='credit';l.cv=[];hist(l,'Checked by Manager, sent to Credit',f.note);notifyRole('credit','Loan to review',l.ref);notify(l.mid,'Loan with Credit Committee',l.ref)}
 else{if(!f.note.trim())throw new Error('Say what must be corrected.');l.status='returned';hist(l,'Returned',f.note);notify(l.mid,'Loan returned for correction',f.note)}log('loan.manager.'+f.d,'loan',l.id,null,null,f.note)};
FORMS.creditVote=async(f,el)=>{needRole('credit');const l=L(el.dataset.id),u=U();if(l.status!=='credit')throw new Error('Not at this stage.');const el_=creditElig(l);if(!el_.some(x=>x.id===u.id))throw new Error('You cannot vote on this loan.');
 if(f.d!=='approve'&&!f.note.trim())throw new Error('A comment is needed to decline or return.');l.cv=l.cv.filter(v=>v.uid!==u.id);l.cv.push({uid:u.id,v:f.d,note:f.note,t:NOW()});log('loan.credit.'+f.d,'loan',l.id,null,null,f.note);
 const nd=needN(el_.length,3),c=k=>l.cv.filter(v=>v.v===k).length;
 if(c('approve')>=nd){l.status='exec';l.es=[];hist(l,'Approved by Credit Committee',c('approve')+' of '+el_.length);notifyRole('mgmt','Loan awaiting executive signatures',l.ref);notify(l.mid,'Credit Committee approved',l.ref+' now goes to the Executive.')}
 else if(c('decline')>=nd){l.status='declined';const why=l.cv.filter(v=>v.v==='decline').map(v=>v.note).join('; ');hist(l,'Declined',why);notify(l.mid,'Loan declined',why+' You may appeal.');l.g.forEach(g=>{if(g.st==='asked')g.st='released'})}
 else if(c('return')>=nd){l.status='returned';const why=l.cv.filter(v=>v.v==='return').map(v=>v.note).join('; ');hist(l,'Returned',why);notify(l.mid,'Loan returned for correction',why)}};
FORMS.execSign=async(f,el)=>{needRole('mgmt');const l=L(el.dataset.id),u=U();if(!OFFICERS.includes(u.officer))throw new Error('Only executive officers sign.');if(l.status!=='exec')throw new Error('Not at this stage.');const ex=execElig(l);if(!ex.some(x=>x.id===u.id))throw new Error('You cannot sign this loan.');
 if(f.d==='refuse'&&!f.note.trim())throw new Error('Give a reason for refusing.');const ok=await askCode(f.d==='sign'?'Sign the approval':'Refuse',false);if(!ok)return;
 l.es=l.es.filter(v=>v.uid!==u.id);l.es.push({uid:u.id,v:f.d,officer:u.officer,note:f.note,t:NOW()});log('loan.exec.'+f.d,'loan',l.id,null,null,f.note);
 const nd=Math.max(1,Math.min(3,ex.length)),c=k=>l.es.filter(v=>v.v===k).length;
 if(c('sign')>=nd){l.status='disburse';l.ratify='pending';hist(l,'Approved by Executive',c('sign')+' signatures');notifyRole('manager','Loan ready for payout',l.ref+' · '+K(l.amount));notify(l.mid,'Loan approved',l.ref+' has been approved and will be paid out.')}
 else if(c('refuse')>=nd){l.status='declined';const why=l.es.filter(v=>v.v==='refuse').map(v=>v.note).join('; ');hist(l,'Declined by Executive',why);notify(l.mid,'Loan declined',why+' You may appeal.')}};
function activate(l,method,ref){const t=NOW();l.status='active';l.bal=l.amount;l.disb={t,by:ui.uid,method,ref};hist(l,'Paid out',method+' '+ref);
 S.tx.push({id:uid(),t,mid:l.mid,kind:'disburse',amt:l.amount,loanId:l.id,ref,receipt:nextNo('r'),by:ui.uid});
 notify(l.mid,'Loan paid out',K(l.amount)+' by '+method+'. First instalment '+K(l.inst)+' is due next month.');l.g.forEach(g=>{if(g.st==='accepted')notify(g.mid,'Loan you guarantee was paid out',lname(l.mid)+' '+l.ref+'. Your pledge stays locked until it is repaid.')})}
FORMS.disburse=async(f,el)=>{needRole('manager');const l=L(el.dataset.id);if(l.status!=='disburse')throw new Error('Not approved yet.');if(l.gl)throw new Error('Disburse group loans together.');
 if(l.amount>fund().lendable)throw new Error('The society does not have enough lendable funds (Loan Policy 1(a), 14).');const ok=await askCode('Confirm payout of '+K(l.amount),false);if(!ok)return;activate(l,f.m,f.ref);log('loan.disburse','loan',l.id,null,{amount:l.amount},f.ref)};
FORMS.repay=async(f,el)=>{needRole('manager');const l=L(el.dataset.id);if(l.status!=='active')throw new Error('This loan is not being repaid.');const amt=Number(f.amt);if(!(amt>0))throw new Error('Enter an amount.');
 const interest=Math.round(l.bal*l.rate/100),ip=Math.min(amt,interest),pr=amt-ip;if(pr>l.bal)throw new Error('That is more than the balance plus interest ('+K(l.bal+interest)+').');
 l.bal-=pr;l.paid+=amt;const rc=nextNo('r');S.tx.push({id:uid(),t:NOW(),mid:l.mid,kind:'loanpay',amt,int:ip,prin:pr,loanId:l.id,ref:f.ref,receipt:rc,by:ui.uid,method:f.m});log('loan.repay','loan',l.id,null,{amt,receipt:rc},f.ref);
 notify(l.mid,'Payment received',K(amt)+' received. Receipt '+rc+'. Balance '+K(l.bal));
 if(l.bal<=0){l.status='cleared';hist(l,'Fully repaid');notify(l.mid,'Loan fully repaid','Well done. Please rate our service.');l.g.forEach(g=>{if(g.st==='accepted')notify(g.mid,'Guarantee released',l.ref+' is fully repaid. Your pledge is free again (Loan Policy 28).')})}};
FORMS.appeal=async(f,el)=>{const l=L(el.dataset.id);mustOwn(l);if(l.status!=='declined'||l.appealed)throw new Error('Cannot appeal.');l.appealed=true;l.status='appeal';hist(l,'Appeal',f.reason);notifyRole('mgmt','Appeal received',l.ref);log('loan.appeal','loan',l.id,null,null,f.reason)};
FORMS.appealDecide=async(f,el)=>{needRole('mgmt');const l=L(el.dataset.id),u=U();if(!OFFICERS.includes(u.officer))throw new Error('Only executive officers decide appeals.');if(l.mid===u.id)throw new Error('You cannot decide your own appeal.');
 if(!f.note.trim())throw new Error('Give the reason for your decision.');if(f.d==='reopen'){l.status='credit';l.cv=[];hist(l,'Appeal upheld, back to Credit',f.note);notifyRole('credit','Appeal reopened',l.ref);notify(l.mid,'Appeal accepted','Your loan goes back to the Credit Committee. '+f.note)}
 else{l.status='declined';hist(l,'Appeal rejected',f.note);notify(l.mid,'Appeal not upheld',f.note)}log('loan.appeal.'+f.d,'loan',l.id,null,null,f.note)};
FORMS.ratify=async(f,el)=>{needRole('mgmt');const l=L(el.dataset.id);l.ratify='done';l.ratRef=f.res;hist(l,'Ratified by Management Committee',f.res);log('loan.ratify','loan',l.id,null,null,f.res)};
FORMS.rate=async(f,el)=>{const l=L(el.dataset.id);mustOwn(l);l.rating={s:Number(f.s),c:f.c};log('rating','loan',l.id,null,l.rating);toast('Thank you.')};
ACT.ack=id=>{const l=L(id);mustOwn(l);l.ack=NOW();hist(l,'Member confirmed receipt');log('loan.ack','loan',l.id);const gl=S.gloans.find(x=>x.id===l.gl);
 if(gl&&gl.lines.every(x=>x.loanId&&L(x.loanId).ack)){gl.status='complete';notifyRole('sup','Group loan signed off',gl.purpose)}};
ACT.arrears=()=>{needRole('manager');let n=0;S.loans.forEach(l=>{const m=monthsLate(l);if(m<1)return;const st=Math.min(m,3);
 if((l.arr||0)<st){l.arr=st;n++;const bn=lname(l.mid);
  if(st===1){notify(l.mid,'Loan payment missed','Your '+l.ref+' instalment is overdue. A written notice is issued (Loan Policy 35(a)).');l.g.forEach(g=>notify(g.mid,'Copy: borrower missed a payment',bn+' '+l.ref+' is 1 month behind.'))}
  if(st===2){notify(l.mid,'Second month overdue',l.ref+' is 2 months behind.');l.g.forEach(g=>notify(g.mid,'You may be called on',bn+' '+l.ref+' is 2 months behind. If nothing is paid by the end of month 3 you will be called on to honour your pledge (Loan Policy 35(b)).'))}
  if(st===3){l.called=true;notify(l.mid,'Guarantors will be called',l.ref+' is 3 months behind.');l.g.forEach(g=>notify(g.mid,'Your guarantee is being called',bn+' '+l.ref+' has been behind for 3 months (Loan Policy 35(b)).'));notifyRole('mgmt','Delinquent loan',l.ref+' is 3 months behind.');notifyRole('sup','Delinquent loan',l.ref+' is 3 months behind.')}
  hist(l,'Arrears step '+st);log('arrears','loan',l.id,null,{step:st})}});toast(n?n+' loan(s) moved to a new arrears step.':'No new arrears steps today.')};

function maxLoanFor(u){const sv=savingsOf(u.id),os=outstanding(u.id),lim=P('loanMult')*sv-os,f=fund(),cap=P('capPct')/100*(f.sh+P('reserves')),gross=Number(u.gross)||0,ex=activeLoans(u.id).reduce((a,l)=>a+l.inst,0),r=rateOf()/100,n=P('maxMonths');
 const room=gross*P('deductPct')/100-ex,byPay=gross>0&&room>0?room*(1-Math.pow(1+r,-n))/r:0;return{sv,os,lim,cap,gross,byPay,max:Math.max(0,Math.min(lim,cap||Infinity,gross>0?byPay:Infinity))}}

const SUG=['How do I apply for a loan?','How much can I borrow?','What should I do now?','How do I join?','What are the guarantor rules?','How do I complain?'];
function assist(q){const raw=q.trim(),ql=raw.toLowerCase(),sw=SW_HINT.test(raw)||ui.chat.lang==='sw';let best=null,bs=0;
 for(const e of KB){let s=0;for(const k of e.k)if(ql.includes(k))s+=k.length>4?2:1;if(s>bs){bs=s;best=e}}
 if(best&&bs>=1){const t=(sw&&best.sw?best.sw():best.en());const go=best.go?(best.go[ui.uid?(ui.role==='member'?'member':'any'):'pub']||(ui.uid?best.go.any:null)):null;
  return{text:t+(sw&&!best.sw?'\n(Kiswahili kamili kinakuja; this answer is in English.)':''),go,ref:best.ref}}
 const hits=CL.map(c=>{const hay=(c.join(' ')).toLowerCase();let s=0;ql.split(/\W+/).filter(w=>w.length>3).forEach(w=>{if(hay.includes(w))s++});return{c,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,2);
 if(hits.length)return{text:'I found these in the Loan Policy and By-laws:\n'+hits.map(h=>`• ${h.c[0]==='LP'?'Loan Policy':'By-laws'} ${h.c[1]} — ${h.c[2]}: ${h.c[3]}`).join('\n'),ref:'',more:true};
 return{text:'I do not have a good answer to that yet. I can help with joining, loans, guarantors, repayment, groups, complaints, privacy and how to use the app. You can send your question to the team and the developer will add it.',unknown:true,q:raw}}
function renderChat(){const c=$('#chat');if(!ui.chat||!ui.chat.open){c.hidden=true;c.innerHTML='';return}c.hidden=false;
 c.innerHTML=`<div class="chat-in" role="dialog" aria-modal="false" aria-label="Assistant"><div class="ch-h"><b>🤖 Assistant</b><span class="sp"></span><button class="btn sec sm" data-act="aiLang">${ui.chat.lang==='sw'?'Kiswahili':'English'}</button><button class="btn sec sm" data-act="aiClose" aria-label="Close assistant">✕</button></div>
 <div class="ch-b" id="chb" tabindex="0">${ui.chat.msgs.map((m,i)=>m.me?`<div class="bub me">${esc(m.text)}</div>`:`<div class="bub bot">${esc(m.text).replace(/\n/g,'<br>')}${m.ref?`<div class="small muted">Source: ${esc(m.ref)}</div>`:''}${m.go?`<div><button class="btn sm" data-act="aiGo" data-a="${esc(m.go)}">Take me there</button></div>`:''}${m.unknown?`<div><button class="btn sm" data-act="aiSend" data-a="${i}">Send this question to the team</button></div>`:''}${m.fb==null&&!m.intro&&!m.unknown?`<div class="small">Was this helpful? <button class="btn sm sec" data-act="aiRate" data-a="${i}" data-b="up" aria-label="Yes">👍</button> <button class="btn sm sec" data-act="aiRate" data-a="${i}" data-b="down" aria-label="No">👎</button></div>`:m.fb?`<div class="small muted">Thanks for the feedback.</div>`:''}</div>`).join('')}</div>
 <div class="ch-s">${SUG.map(s=>`<button class="chip" data-act="aiChip" data-a="${esc(s)}">${esc(s)}</button>`).join('')}</div>
 <form data-form="aiAsk" class="ch-f"><input name="q" id="aiq" placeholder="Ask about loans, rules or how to use this app" autocomplete="off" aria-label="Your question"><button class="btn sm">Ask</button></form></div>`;
 const b=$('#chb');if(b)b.scrollTop=b.scrollHeight}
function ask(q){if(!q.trim())return;ui.chat.msgs.push({me:true,text:q});const a=assist(q);ui.chat.msgs.push({text:a.text,ref:a.ref,go:a.go,unknown:a.unknown,q:a.q});renderChat();const i=$('#aiq');if(i)i.focus()}
ACT.aiOpen=()=>{if(!ui.chat)ui.chat={open:false,lang:'en',msgs:[]};ui.chat.open=!ui.chat.open;if(ui.chat.open&&!ui.chat.msgs.length)ui.chat.msgs.push({intro:true,text:`Hello${U()?' '+U().name.split(' ')[0]:''}. I answer from your society’s Loan Policy and By-laws and from how this app works${mdl()?', and I can work out your own limits on this device':''}. I cannot approve anything or change any data. Ask me, or pick a question below.`});renderChat()};
ACT.aiClose=()=>{ui.chat.open=false;renderChat()};
ACT.aiLang=()=>{ui.chat.lang=ui.chat.lang==='sw'?'en':'sw';renderChat()};
ACT.aiChip=q=>ask(q);
ACT.aiGo=v=>{ui.chat.open=false;renderChat();if(U()){ui.view=v}else ui.pub=v;ui.flash=null};
ACT.aiRate=(i,d)=>{const m=ui.chat.msgs[+i],prev=ui.chat.msgs[+i-1];m.fb=d;S.ai=S.ai||{up:0,down:0};S.ai[d]++;save();renderChat();
 if(d==='down')openFeedback('Assistant answer','The assistant did not help with: “'+(prev?prev.text:'')+'”. What I expected: ')};
ACT.aiSend=i=>{const m=ui.chat.msgs[+i];S.feedback.push({id:uid(),uid:ui.uid,role:ui.role||'',page:'assistant',kind:'Unanswered question',msgs:[{from:'user',text:m.q,t:NOW()}],status:'new',ver:BUILD,t:NOW()});notifyRole('admin','Assistant could not answer',m.q.slice(0,80));save();m.unknown=false;m.text='Sent to the team. Thank you.';m.fb=0;renderChat()};

 <form data-form="fbQuick"><label for="fbk">Type</label><select id="fbk" name="kind">${['Problem','Confusing screen','Idea','Question','Assistant answer'].map(k=>`<option ${k===(kind||'Problem')?'selected':''}>${k}</option>`).join('')}</select>

 log('feedback','feedback',o.id,null,{kind:f.kind,page:o.page});notifyRole('admin','New feedback',f.kind+(U()?' from '+U().name:' from a visitor'));ACT.fbClose();toast('Sent. Thank you.')};

 if(adm){if(x.status==='new')x.status='seen';if(x.uid)notify(x.uid,'Reply to your feedback',f.text.slice(0,120))}else{if(x.status==='fixed'||x.status==='closed')x.status='seen';notifyRole('admin','Feedback reply',f.text.slice(0,80))}log('feedback.reply','feedback',x.id)};
