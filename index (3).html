<style>
:root{--g:#0b5d3b;--g2:#e6f2ec;--bg:#f4f6f5;--tx:#17211c;--mu:#5a665f;--bd:#d9e0dc;--red:#b3261e;--amb:#8a4d00;--blue:#1b5fa8;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;padding-bottom:76px}

body::after{content:"";position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:9000;background-image:var(--wm,none);background-repeat:repeat}

.tw{overflow-x:auto}

<script>

/* =====================================================================

   Every figure on every screen is derived from the state + ledger below.
   ===================================================================== */
const KEY='coopvault_v12_trial';
const BUILD='v12.1 · 7 Nov 2026';
const ACC={'1000':'Bank','1100':'Loans Receivable','1200':'M-Pesa Clearing','2000':'Member Savings','3000':'Reserves','3100':'Share Capital','4000':'Interest Income','4100':'Fee & Penalty Income','5000':'Operating Expenses','5100':'Interest / Dividends on Savings'};
const DEBIT_NORMAL=['1000','1100','1200','5000','5100'];
const POL0={minMonths:6,minSavings:12000,maxMult:3,dedCap:2/3,maxPeriod:36,rate:0.015,guarantors:5,journalLimit:100000,penaltyRate:0.05,guarantorDays:30,defaultDays:60};
const POL_LABEL={minMonths:'Minimum membership (months)',minSavings:'Minimum savings (KSh)',maxMult:'Loan multiple of savings',maxPeriod:'Max repayment period (months)',rate:'Interest per month (declining)',journalLimit:'Manager journal limit (KSh)',penaltyRate:'Late penalty (share of overdue instalment)',guarantorDays:'Notify guarantors after (days late)',defaultDays:'Default escalation after (days late)'};
const OPEN=['guarantors','credit','exec','approved','batched','active'];
const PIPE=['guarantors','credit','exec','approved','batched'];
const MEMBERISH=['member','external'];
const ROLES={
 member:{label:'Member',icon:'👤',tabs:[['home','Home'],['loans','Loans'],['guar','Guarantees'],['ledger','Ledger'],['help','Assistant']]},
 external:{label:'External Member',icon:'🧑‍💼',tabs:[['home','Home'],['loans','Loans'],['guar','Guarantees'],['ledger','Ledger'],['help','Assistant']]},
 manager:{label:'Manager',icon:'🧾',key:true,tabs:[['today','Today'],['import','Import'],['batches','Batches'],['journals','Journals'],['members','Members']]},
 credit:{label:'Credit Committee',icon:'🗳️',tabs:[['home','Vote'],['history','History'],['rules','Rules']]},
 exec:{label:'Executive Committee',icon:'🏛️',key:true,tabs:[['home','Pending'],['loans','Loans'],['access','Access'],['policy','Policy'],['audit','Audit']]},
 sup:{label:'Supervisory Committee',icon:'👁️',tabs:[['alerts','Alerts'],['reviews','Reviews'],['ledger','Ledger'],['loans','Loans'],['attest','Attest']]},
 edu:{label:'Education Committee',icon:'🎓',tabs:[['home','Progress'],['materials','Materials'],['queries','Queries']]}
};
const STAGES=['','Reminder sent','Guarantors notified','DEFAULT – escalated to Executive'];
/* ---------- clock (simulation can move time forward) ---------- */
let CLOCK=0,SIM=false,LAST=null;
const NOW=()=>new Date(Date.now()+CLOCK*864e5);
/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'KSh '+Math.round(n||0).toLocaleString('en-KE');
const money2=n=>'KSh '+(n||0).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso=d=>(d||NOW()).toISOString();
const dstr=s=>new Date(s).toLocaleDateString('en-KE',{day:'2-digit',month:'short',year:'numeric'});
const tstr=s=>new Date(s).toLocaleString('en-KE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const monthsAgo=n=>{const d=NOW();d.setMonth(d.getMonth()-n);return iso(d)};
const daysAgo=n=>iso(new Date(NOW().getTime()-n*864e5));
const monthsBetween=s=>{const a=new Date(s),b=NOW();let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;return Math.max(0,m)};
const round2=x=>Math.round(x*100)/100;
const sum=(a,f)=>a.reduce((x,y)=>x+(typeof f==='function'?f(y):(+y[f]||0)),0);
const pkey=d=>{d=d||NOW();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
 return (4294967296*(2097151&h2)+(h1>>>0)).toString(16).padStart(14,'0')}
function pmt(P,r,n){return r?P*r/(1-Math.pow(1+r,-n)):P/n}
function makeSchedule(P,r,n,firstDue){const inst=round2(pmt(P,r,n));let bal=P;const rows=[];
 for(let i=1;i<=n;i++){const intr=round2(bal*r);let prin=round2(inst-intr);if(i===n)prin=round2(bal);bal=round2(bal-prin);const d=new Date(firstDue);d.setMonth(d.getMonth()+i-1);
  rows.push({n:i,due:iso(d),pay:round2(prin+intr),interest:intr,principal:prin,balance:Math.max(0,bal),paid:false})}
 return rows}
function firstDueAfter(disbIso){const d=new Date(disbIso);d.setDate(Math.min(d.getDate(),28));d.setMonth(d.getMonth()+1);return iso(d)}

/* ---------- seed (mode 'demo' = sample SACCO, 'clean' = empty SACCO, officials only) ---------- */
function seed(mode){
 CLOCK=0;
 const S={v:12,clock:0,seq:100,session:null,mode,policy:{...POL0},settings:{aiEndpoint:''},users:[],loans:[],journals:[],pendingJ:[],batches:[],payouts:[],divRuns:[],audit:[],alerts:[],access:[],mpesa:[],
  materials:[],progress:[],queries:[],proposals:[],attest:{},periods:{},inbox:[],txns:[],reversals:{}};
 const U=(id,name,role,x)=>S.users.push(Object.assign({id,name,role,phone:'07'+String(10000000+S.users.length*137771).slice(0,8),email:id+'@rivabot.example',idno:String(20000000+S.users.length*13579),joined:monthsAgo(24),savings:0,shares:0,salary:0,deductions:0},x||{}));
 if(mode==='demo'){
  U('m1','Grace Wanjiku','member',{savings:240000,shares:5000,salary:95000,deductions:12000,joined:monthsAgo(40)});
  U('m2','Peter Kiprono','member',{savings:180000,shares:5000,salary:80000,deductions:8000,joined:monthsAgo(30)});
  U('m3','Mary Achieng','member',{savings:150000,shares:5000,salary:70000,deductions:5000,joined:monthsAgo(28)});
  U('m4','John Mwangi','member',{savings:320000,shares:5000,salary:120000,deductions:15000,joined:monthsAgo(60)});
  U('m5','Faith Njeri','member',{savings:90000,shares:5000,salary:60000,deductions:4000,joined:monthsAgo(14)});
  U('m6','Samuel Otieno','member',{savings:210000,shares:5000,salary:88000,deductions:9000,joined:monthsAgo(36)});
  U('m7','Lucy Chebet','member',{savings:130000,shares:5000,salary:65000,deductions:6000,joined:monthsAgo(20)});
  U('m8','David Kamau','member',{savings:8000,shares:2000,salary:50000,deductions:2000,joined:monthsAgo(9)});
  U('m9','Esther Wambui','member',{savings:60000,shares:2000,salary:55000,deductions:3000,joined:monthsAgo(3)});
  U('x1','Brian Mutua','external',{savings:110000,shares:3000,salary:72000,deductions:7000,joined:monthsAgo(18)});
 }
 U('mg1','Agnes Muthoni','manager',{savings:150000,salary:110000});
 ['Hassan Abdi','Joyce Nyambura','Tom Ochieng','Ruth Jeptoo'].forEach((n,i)=>U('c'+(i+1),n,'credit',{savings:100000+i*20000,salary:90000}));
 [['Dr. Kariuki','Chair'],['Mercy Atieno','Vice Chair'],['Isaac Mburu','Secretary'],['Beatrice Wafula','Treasurer']].forEach((n,i)=>U('e'+(i+1),n[0],'exec',{post:n[1],savings:200000,salary:130000}));
 ['Patrick Njoroge','Alice Mwende','Kennedy Barasa'].forEach((n,i)=>U('s'+(i+1),n,'sup',{savings:120000,salary:85000}));
 ['Susan Moraa','Daniel Kiplagat','Naomi Wangari','Collins Odhiambo'].forEach((n,i)=>U('d'+(i+1),n,'edu',{savings:90000,salary:70000}));
 if(mode==='clean'){ // officials hold no money in a clean start: every figure must come from entered transactions
  S.users.forEach(u=>{u.savings=0;u.shares=0});
  return S}
 const disb=monthsAgo(3);const sch=makeSchedule(300000,POL0.rate,24,firstDueAfter(disb));sch[0].paid=true;
 const mk=(id,uid,amt,per,status,gs,extra)=>Object.assign({id,uid,amount:amt,period:per,rate:POL0.rate,instalment:round2(pmt(amt,POL0.rate,per)),status,payslip:'payslip.pdf',payslipOK:false,
   guars:gs.map(g=>({uid:g[0],amt:g[1],status:g[2]||'accepted'})),votes:{},schedule:[],created:daysAgo(5),creditAt:null,events:[]},extra||{});
 S.loans.push(mk('L1','m1',300000,24,'active',[['m4',60000],['m6',60000],['m2',60000],['m3',60000],['x1',60000]],{created:monthsAgo(3),disbursed:disb,schedule:sch,payslipOK:true}));
 S.loans.push(mk('L2','m2',150000,12,'credit',[['m4',30000],['m6',30000],['m7',30000],['m3',30000],['x1',30000]],{creditAt:daysAgo(2),votes:{c1:{v:'approve',t:daysAgo(1)}}}));
 S.loans.push(mk('L3','m3',100000,12,'guarantors',[['m4',20000,'pending'],['m6',20000,'accepted'],['m7',20000,'pending'],['m2',20000,'accepted'],['x1',20000,'accepted']],{created:daysAgo(1)}));
 S.loans.forEach(l=>l.events.push({t:l.created,text:'Application submitted'}));
 S.users.forEach(u=>{if(u.savings)S.txns.push({uid:u.id,t:u.joined,k:'sav',desc:'Opening savings balance',amt:u.savings});if(u.shares)S.txns.push({uid:u.id,t:u.joined,k:'shr',desc:'Opening share capital',amt:u.shares})});
 const lb=sch[1].balance+sch[1].principal,totSav=sum(S.users,'savings'),totSh=sum(S.users,'shares');
 postJournal(S,{desc:'Opening balances',by:'system',kind:'opening',lines:[{acct:'1000',dr:3000000,cr:0},{acct:'1100',dr:lb,cr:0},{acct:'2000',dr:0,cr:totSav},{acct:'3100',dr:0,cr:totSh},{acct:'3000',dr:0,cr:3000000+lb-totSav-totSh}]});
 S.access.push({id:'A1',execId:'e2',targetId:'m3',scope:'Salary & ID',reason:'Verify payslip discrepancy raised by Credit Committee',t:daysAgo(6),token:'482915',status:'granted',review:null});
 const pd=NOW();pd.setDate(1);pd.setMonth(pd.getMonth()-1);S.periods[pkey(pd)]={status:'open'};
 S.materials.push({id:'ED1',title:'How guarantorship works',lang:'EN',body:'A guarantor pledges part of their savings. Those savings stay locked until the loan is cleared.',by:'d1',t:daysAgo(10)});
 S.materials.push({id:'ED2',title:'Jinsi dhamana inavyofanya kazi',lang:'SW',body:'Mdhamini huweka sehemu ya akiba yake. Akiba hiyo hufungwa hadi mkopo ulipwe wote.',by:'d1',t:daysAgo(10)});
 S.progress.push({id:'PR1',title:'Q3 member training',text:'312 members trained across 4 sessions. Next: financial planning (Kiswahili).',by:'d2',t:daysAgo(8)});
 return S}

/* ---------- ledger engine ---------- */
function postJournal(S,{desc,lines,by,kind}){
 const dr=sum(lines,'dr'),cr=sum(lines,'cr');
 if(!(dr>0)||Math.abs(dr-cr)>0.005)throw new Error('Journal is not balanced (Dr '+dr+' ≠ Cr '+cr+')');
 lines.forEach(l=>{if(!ACC[l.acct])throw new Error('Unknown account '+l.acct)});
 const prev=S.journals.length?S.journals[S.journals.length-1].hash:'GENESIS';
 const e={id:'J'+String(S.journals.length+1).padStart(4,'0'),t:iso(),desc,lines,by,kind:kind||'manual',prev};
 e.hash=hash([prev,e.id,e.t,e.desc,JSON.stringify(e.lines),e.by].join('|'));
 S.journals.push(e);return e}
function chainOK(){let prev='GENESIS';for(const e of S.journals){if(e.prev!==prev)return false;if(e.hash!==hash([prev,e.id,e.t,e.desc,JSON.stringify(e.lines),e.by].join('|')))return false;prev=e.hash}return true}
function balance(a){const d=sum(S.journals,j=>sum(j.lines.filter(l=>l.acct===a),'dr')),c=sum(S.journals,j=>sum(j.lines.filter(l=>l.acct===a),'cr'));return round2(DEBIT_NORMAL.includes(a)?d-c:c-d)}
function post(o){const e=postJournal(S,o);pushAlert('txn',`${e.id} · ${o.desc} · ${money(sum(o.lines,'dr'))}`,o.by);audit('journal.post',`${e.id} ${o.desc}`,o.by);return e}
function pushAlert(type,text,by,extra){S.alerts.unshift(Object.assign({id:'AL'+(++S.seq),t:iso(),type,text,by:by||'system'},extra||{}));S.alerts=S.alerts.slice(0,400)}
function audit(action,detail,by){S.audit.unshift({t:iso(),by:by||(S.session||'system'),action,detail});S.audit=S.audit.slice(0,600)}
function notify(uid,text){S.inbox.unshift({uid,t:iso(),text});S.inbox=S.inbox.slice(0,500)}
function ensurePeriods(){const cur=pkey(NOW()),c=Object.keys(S.periods);if(S.journals.length)c.push(pkey(new Date(S.journals[0].t)));if(!c.length)return;c.sort();
 let [y,m]=c[0].split('-').map(Number),k=c[0];while(k<cur){if(!S.periods[k])S.periods[k]={status:'open'};m++;if(m>12){m=1;y++}k=y+'-'+String(m).padStart(2,'0')}}

/* ---------- state + domain helpers ---------- */
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===12){CLOCK=s.clock||0;s.reversals=s.reversals||{};return s}}catch(e){}return seed('demo')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const U=id=>S.users.find(x=>x.id===id);
const nm=id=>id==='mpesa-c2b'?'M-Pesa C2B':(U(id)?U(id).name:(id||'system'));
const cur=()=>U(S.session);
const loanOf=id=>S.loans.find(l=>l.id===id);
const need=(...r)=>{const u=cur();if(!u||!r.includes(u.role))throw new Error('Not allowed for your role')};
const refinancedIds=()=>new Set(S.loans.filter(l=>PIPE.includes(l.status)&&l.refinanceOf).map(l=>l.refinanceOf));
const committed=id=>{const rf=refinancedIds();return sum(S.loans.filter(l=>OPEN.includes(l.status)&&!rf.has(l.id)),l=>sum(l.guars.filter(g=>g.uid===id&&g.status!=='declined'),'amt'))};
const free=id=>round2(U(id).savings-committed(id));
const loanBal=l=>{const r=l.schedule.find(x=>!x.paid);return r?round2(r.balance+r.principal):0};
const outstanding=id=>round2(sum(S.loans.filter(l=>l.uid===id&&l.status==='active'),loanBal));
const daysLate=l=>{const r=l.schedule.find(x=>!x.paid);if(!r)return 0;const d=Math.floor((NOW()-new Date(r.due))/864e5);return d>0?d:0};
const arrStage=l=>{if(l.status!=='active')return 0;const d=daysLate(l),P=S.policy;return d>=P.defaultDays?3:d>=P.guarantorDays?2:d>0?1:0};
const penaltyDue=l=>{const r=l.schedule.find(x=>!x.paid);return r&&new Date(r.due)<NOW()?round2(r.pay*S.policy.penaltyRate):0};
function elig(u,refi){const P=S.policy,m=monthsBetween(u.joined),old=refi?loanOf(refi):null;
 const open=S.loans.some(l=>l.uid===u.id&&PIPE.includes(l.status));
 const checks=[[m>=P.minMonths,`Member for at least ${P.minMonths} months (you: ${m})`],[u.savings>=P.minSavings,`Savings of at least ${money(P.minSavings)} (you: ${money(u.savings)})`],[!open,'No application already in progress'],[!u.exited,'Membership is active']];
 const ob=outstanding(u.id)-(old&&old.status==='active'?loanBal(old):0);
 return{checks,ok:checks.every(c=>c[0]),max:Math.max(0,Math.floor(P.maxMult*u.savings-ob))}}
function calc(u,amt,n,refi){const P=S.policy,E=elig(u,refi);const inst=amt>0?pmt(amt,P.rate,n):0,existing=sum(S.loans.filter(l=>l.uid===u.id&&l.status==='active'&&l.id!==refi),'instalment'),ded=u.deductions+existing+inst,cap=u.salary*P.dedCap;

 add(!bad.length,'Every member statement adds up to their balance',bad.map(b=>b.name).join(', '));
 const over=S.users.filter(u=>committed(u.id)>u.savings+0.01);add(!over.length,'No guarantor pledged more than their savings',over.map(o=>o.name).join(', '));
 add(balance('1000')>=0,'Bank balance not negative',money2(balance('1000')));
 const q=S.loans.filter(l=>['credit','exec','approved','batched','active'].includes(l.status)&&!l.guars.every(g=>g.status==='accepted'));add(!q.length,'Loans past guarantor stage have all 5 acceptances',q.map(l=>l.id).join(', '));

 return R}

function batchItems(b){return b.loanIds.map(i=>`Loan ${i} (${money(cashOut(loanOf(i)))})`).concat(b.payoutIds.map(i=>{const p=S.payouts.find(x=>x.id===i);return `${p.type==='exit'?'Exit':'Withdrawal'} ${i} – ${nm(p.uid)} (${money(p.amount)})`})).join(', ')}
function statementCSV(u){const rows=[['Date','Type','Description','Amount (KSh)']];
 S.txns.filter(t=>t.uid===u.id).forEach(t=>rows.push([dstr(t.t),t.k==='shr'?'Shares':'Savings',t.desc,t.amt]));

/* ---------- AI assistant (reads the member's own live data; optional LLM endpoint) ---------- */
function aiContext(u){const E=elig(u);return{firstName:u.name.split(' ')[0],savings:u.savings,shares:u.shares,freeToGuarantee:free(u.id),maxLoan:E.max,eligible:E.ok,
 loans:S.loans.filter(l=>l.uid===u.id).map(l=>({id:l.id,status:l.status,amount:l.amount,balance:l.status==='active'?loanBal(l):0,daysLate:daysLate(l),nextDue:(l.schedule.find(r=>!r.paid)||{}).due||null})),
 policy:{...S.policy},today:iso()}}
function assistantLocal(q,u){
 const s=q.toLowerCase(),P=S.policy,sw=/(akiba|salio|mkopo|nataka|naweza|lini|kiasi|habari|asante|dhamana|mdhamini|riba|kukopa|malipo|hisa|hujambo|msaada)/.test(s);
 const nums=(s.match(/\d[\d,]*/g)||[]).map(x=>+x.replace(/,/g,'')).filter(x=>x>0),amt=nums.find(x=>x>36),mon=nums.find(x=>x<=36)||12;
 const E=elig(u),T=(en,swt)=>sw?(swt||'(English) '+en):en;
 const nextDue=()=>{let b=null;S.loans.filter(l=>l.uid===u.id&&l.status==='active').forEach(l=>{const r=l.schedule.find(x=>!x.paid);if(r&&(!b||r.due<b.r.due))b={l,r}});return b};
 if(/^(hi|hello|hey|habari|hujambo|help|msaada)\b/.test(s))return T(`Hello ${u.name.split(' ')[0]}. Ask me about your savings, loan status, next instalment, how much you can borrow, guarantors, penalties, withdrawals or dividends.`,`Habari ${u.name.split(' ')[0]}. Niulize kuhusu akiba, mkopo, malipo yajayo, kiasi unachoweza kukopa, wadhamini au adhabu.`);
 if(amt&&/(borrow|loan|kukopa|nikope|mkopo|naweza|can i)/.test(s)&&!/(interest|riba|cost|gharama)/.test(s)){const c=calc(u,amt,mon);
  if(E.ok&&c.ok)return T(`Yes. ${money(amt)} over ${mon} months needs about ${money(c.inst)} a month and passes the 2/3 deduction rule. You still need 5 guarantors whose pledges add up to ${money(amt)}.`,`Ndiyo. ${money(amt)} kwa miezi ${mon} ni takriban ${money(c.inst)} kwa mwezi. Bado unahitaji wadhamini 5 wenye jumla ya ${money(amt)}.`);
  return T(`Not yet. ${[...E.checks.filter(x=>!x[0]).map(x=>x[1]),...c.rows.filter(x=>!x[0]).map(x=>x[1])].join('; ')}.`,`Bado. ${[...E.checks.filter(x=>!x[0]).map(x=>x[1]),...c.rows.filter(x=>!x[0]).map(x=>x[1])].join('; ')}.`)}
 if(amt&&/(interest|riba|cost|gharama|repay)/.test(s)){const i=pmt(amt,P.rate,mon);return T(`${money(amt)} over ${mon} months at ${(P.rate*100).toFixed(2)}% per month (declining balance): about ${money(i)} a month, ${money(i*mon)} in total, of which ${money(i*mon-amt)} is interest.`)}
 if(/(next|due|instal|malipo|lini)/.test(s)){const n=nextDue();return n?T(`Your next instalment is ${money(n.r.pay)} due ${dstr(n.r.due)} (loan ${n.l.id}).${new Date(n.r.due)<NOW()?` It is overdue — a ${(P.penaltyRate*100).toFixed(0)}% penalty of ${money(penaltyDue(n.l))} applies.`:''}`,`Malipo yako yajayo ni ${money(n.r.pay)} tarehe ${dstr(n.r.due)} (mkopo ${n.l.id}).`):T('You have no instalments due.','Huna malipo yanayosubiri.')}
 if(/(my loan|loan status|mkopo wangu|hali|status)/.test(s)){const ls=S.loans.filter(l=>l.uid===u.id);return ls.length?ls.map(l=>`${l.id}: ${money(l.amount)} – ${STAT[l.status][0]}${l.status==='active'?`, balance ${money(loanBal(l))}`:''}`).join('\n'):T('You have no loans yet.','Huna mkopo bado.')}
 if(/(balance|savings|akiba|salio)/.test(s))return T(`Your savings are ${money(u.savings)} and shares ${money(u.shares)}. You can pledge up to ${money(free(u.id))} for others and withdraw up to ${money(maxWithdraw(u))}.`,`Akiba yako ni ${money(u.savings)}, hisa ${money(u.shares)}. Unaweza kudhamini hadi ${money(free(u.id))}.`);
 if(/(queue|position|foleni)/.test(s)){const q=S.loans.filter(l=>l.status==='credit').sort((a,b)=>a.creditAt<b.creditAt?-1:1),m=q.filter(l=>l.uid===u.id);return m.length?m.map(l=>`${l.id}: position ${q.indexOf(l)+1} of ${q.length}`).join('\n'):`No application of yours is in the Credit queue (${q.length} waiting).`}
 if(/(limit|how much|max|kiasi|kukopa)/.test(s))return T(`You can borrow up to ${money(E.max)} now (${P.maxMult}× your savings less other loans).`,`Unaweza kukopa hadi ${money(E.max)} (mara ${P.maxMult} ya akiba yako ukiondoa mikopo iliyopo).`);
 if(/guarant|dhamana|mdhamini/.test(s)){const pend=S.loans.filter(l=>l.status==='guarantors'&&l.guars.some(g=>g.uid===u.id&&g.status==='pending')).length;return `You need exactly ${P.guarantors} guarantors whose pledges add up to the loan. Officials cannot guarantee. You have ${money(committed(u.id))} pledged, ${money(free(u.id))} free, and ${pend} request(s) waiting.`}
 if(/(late|penalt|arrear|default|chelewa)/.test(s)){const ls=S.loans.filter(l=>l.uid===u.id&&l.status==='active'&&daysLate(l)>0);return `A late instalment attracts a ${(P.penaltyRate*100).toFixed(0)}% penalty. Guarantors are told after ${P.guarantorDays} days and the loan is escalated as a default after ${P.defaultDays} days, when pledges can be called. ${ls.length?ls.map(l=>`${l.id} is ${daysLate(l)} days late.`).join(' '):'None of your loans is late.'}`}
 if(/(withdraw|exit|leave|toa)/.test(s)){const eb=exitBlock(u);return `You can withdraw up to ${money(maxWithdraw(u))} now (free savings, keeping the minimum and enough to cover your loans). ${eb?'Exit is not possible yet: '+eb+'.':'You can request to exit from the Ledger tab.'}`}
 if(/(dividend|shares|hisa|interest on savings)/.test(s)){const d=S.txns.filter(t=>t.uid===u.id&&/dividend|interest on/i.test(t.desc)).slice(-1)[0];return `You hold ${money(u.shares)} in shares. ${d?`Last credit: ${money(d.amt)} (${d.desc}).`:'No dividend has been credited yet.'} Dividends are approved by 3 of 4 Executive members.`}
 if(/(statement|download|print)/.test(s))return 'Open the Ledger tab: you can download a CSV statement or print / save it as PDF.';
 if(/(eligib|qualif)/.test(s))return `You must be a member for ${P.minMonths}+ months with at least ${money(P.minSavings)} saved. Right now: ${E.checks.map(c=>(c[0]?'✓ ':'✗ ')+c[1]).join('; ')}.`;
 if(/(interest|rate|riba)/.test(s))return `Interest is ${(P.rate*100).toFixed(2)}% per month on the declining balance.`;
 if(/(long|period|month|miezi)/.test(s))return `The maximum repayment period is ${P.maxPeriod} months. Repayment starts the month after disbursement.`;
 return 'I can answer from your own records: savings, loan status, next instalment, borrowing limit, guarantors, penalties, withdrawals and dividends. For anything else use “Ask the Education Committee” below.'}
async function askAI(q){const u=cur();ui.chat.push({w:'me',t:q});const local=assistantLocal(q,u),ep=S.settings.aiEndpoint;audit('ai.ask','(content not logged)',u.id);
 if(!ep){ui.chat.push({w:'bot',t:local,src:'answered from your records'});render();return}
 const slot={w:'bot',t:'…',src:'asking AI'};ui.chat.push(slot);render();
 try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);const r=await fetch(ep,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q,context:aiContext(u)}),signal:ctl.signal});clearTimeout(to);
  const j=await r.json();if(!j||typeof j.answer!=='string')throw new Error('bad reply');slot.t=j.answer;slot.src='AI (read-only, your data only)'}
 catch(e){slot.t=local;slot.src='AI unreachable — answered from your records'}
 render()}

 register(f){need('manager');const id='m'+(++S.seq);if(S.users.some(x=>x.idno===f.get('idno')||x.phone===f.get('phone')))return toast('A member with that ID number or phone already exists',1);

 access(f){need('exec');const u=cur(),tok=String(Math.floor(100000+Math.random()*900000));const a={id:'A'+(++S.seq),execId:u.id,targetId:f.get('target'),scope:f.get('scope'),reason:f.get('reason'),t:iso(),token:tok,status:'pending',review:null};

/* ---------- complete simulation: empty SACCO → 8 months of life, through the same functions the screens use ---------- */
function simulate(){
 const L=[];SIM=true;
 const step=(name,fn)=>{try{LAST=null;const r=fn();if(LAST&&LAST.err)throw new Error(LAST.msg);L.push({name,ok:r!==false,detail:typeof r==='string'?r:''})}catch(e){L.push({name,ok:false,detail:e.message})}};
 const as=id=>{S.session=id},fd=o=>({get:k=>o[k]}),el=(id,x)=>({dataset:Object.assign({id},x||{})});
 const run=fn=>{LAST=null;fn();if(LAST&&LAST.err)throw new Error(LAST.msg)};
 const check=()=>{const bad=reconcile().filter(r=>!r.ok);if(bad.length)throw new Error(bad.map(b=>b.t).join('; '))};
 try{
 S=seed('clean');ui.tab=null;ui.chat=[];setApplyReset();
 let M=[];
 step('Start empty: only the 16 office-bearer seats exist, all balances zero',()=>{if(S.users.length!==16||S.journals.length||sum(S.users,'savings'))throw new Error('not empty');return 'bank '+money(balance('1000'))});
 step('Manager registers 9 members (1 external)',()=>{as('mg1');const names=['Wanjiru Kamau','Otieno Odhiambo','Chebet Rotich','Mutua Ndolo','Akinyi Ouma','Njoroge Gitau','Halima Yusuf','Kiptoo Langat','Zawadi Mwita'];
  names.forEach((n,i)=>run(()=>FORMS.register(fd({name:n,phone:'07120000'+String(10+i),idno:'3000000'+i,salary:90000+i*5000,deductions:i%3*2000,type:i===8?'external':'member'}))));
  M=S.users.filter(x=>MEMBERISH.includes(x.role)).map(x=>x.id);return M.length+' members'});
 step('Duplicate ID is rejected',()=>{as('mg1');LAST=null;FORMS.register(fd({name:'Dup',phone:'0700000000',idno:'30000000',salary:1,type:'member'}));if(!(LAST&&LAST.err))throw new Error('duplicate accepted');LAST=null});
 step('Share capital recorded for every member',()=>{as('mg1');M.forEach(id=>run(()=>FORMS.share(fd({uid:id,amount:5000,src:'M-Pesa'}))));return money(balance('3100'))});
 step('Non-manager cannot post journals (maker-checker role guard)',()=>{as('e1');let blocked=false;try{FORMS.journal(fd({dr:'1000',cr:'3000',amt:10,desc:'sneaky'}))}catch(e){blocked=true}if(!blocked)throw new Error('exec could post a journal')});
 step('8 months of M-Pesa C2B contributions credit members automatically',()=>{as('mg1');
  for(let mo=0;mo<8;mo++){M.forEach((id,i)=>{const u=U(id);c2b({transId:'SIM'+mo+'X'+i,msisdn:u.phone,billRef:mo%2?u.idno:u.phone,amount:12000+i*2000})});
   if(mo===2)c2b({transId:'SIMUNMATCHED',msisdn:'0799999999',billRef:'nobody',amount:3000});
   if(mo<7){CLOCK+=31;S.clock=CLOCK;ensurePeriods();runArrears()}}
  return 'savings '+money(balance('2000'))});
 step('Duplicate M-Pesa TransID rejected',()=>{let blocked=false;try{c2b({transId:'SIM0X0',msisdn:U(M[0]).phone,billRef:'',amount:100})}catch(e){blocked=true}if(!blocked)throw new Error('duplicate accepted')});
 step('Unmatched C2B assigned by hand and posted',()=>{as('mg1');const ln=S.mpesa.find(m=>m.ref==='SIMUNMATCHED');CHG.assign({dataset:{id:ln.id},value:M[0]});run(()=>ACT.postmatched());if(!ln.posted)throw new Error('not posted')});
 step('Books reconcile after contributions',check);
 step('Manager settles M-Pesa clearing to bank: over the limit, so an Executive approves it',()=>{as('mg1');const amt=Math.floor(balance('1200')*0.9);run(()=>FORMS.journal(fd({dr:'1000',cr:'1200',amt,desc:'Settle M-Pesa clearing to bank'})));const pj=S.pendingJ.find(j=>j.status==='pending');if(!pj)throw new Error('not held for approval');as('e3');run(()=>ACT.apprj(el(pj.id)));if(balance('1000')<amt)throw new Error('bank not funded');check();return 'bank '+money(balance('1000'))});
 const guars=(ex,n)=>M.filter(x=>x!==ex&&x!==M[8]&&x!==M[3]).slice(0,n);
 const applyLoan=(uid,amt,per,gs,refi)=>{as(uid);ui.apply={amount:String(amt),period:per,guar:gs,gamt:gs.map(()=>String(amt/5)),file:'payslip.pdf',refi:refi||''};run(()=>FORMS.apply(fd({})));return S.loans[S.loans.length-1]};
 const approveAll=l=>{l.guars.forEach(g=>{as(g.uid);run(()=>ACT.gaccept(el(l.id)))})};
 const credit=(l,ids)=>ids.forEach((c,i)=>{as(c);run(()=>ACT.verifypay(el(l.id)));run(()=>ACT.vote(el(l.id,{v:'approve'})))});
 const exec=(l)=>{as('e1');run(()=>ACT.execloan(el(l.id,{v:'ok'})))};
 const batch=(items)=>{as('mg1');ui.batchSel={};items.forEach(k=>ui.batchSel[k]=true);run(()=>ACT.prepbatch());const b=S.batches[S.batches.length-1];['e1','e2','e3'].forEach(e=>{as(e);run(()=>ACT.signbatch(el(b.id)))});return b};
 let LA,LB,LC,LD;
 step('Loan A (Kiptoo, KSh 150,000): apply → 5 guarantors accept → credit queue',()=>{LA=applyLoan(M[7],150000,12,guars(M[7],5));approveAll(LA);if(LA.status!=='credit')throw new Error('status '+LA.status)});
 step('Loan B (Otieno, KSh 80,000) reaches the credit queue',()=>{LB=applyLoan(M[1],80000,12,guars(M[1],5));approveAll(LB);if(LB.status!=='credit')throw new Error(LB.status)});
 step('Credit member cannot vote before the payslip is verified',()=>{as('c1');LAST=null;ACT.vote(el(LA.id,{v:'approve'}));if(!(LAST&&LAST.err))throw new Error('voted without payslip');LAST=null});
 step('Loans A and B approved 3 of 4, signed off by Executive',()=>{credit(LA,['c1','c2','c3']);credit(LB,['c1','c2','c3']);exec(LA);exec(LB);if(LA.status!=='approved'||LB.status!=='approved')throw new Error('not approved')});
 step('Manager cannot sign a payment batch',()=>{as('mg1');ui.batchSel={['L:'+LA.id]:true,['L:'+LB.id]:true};run(()=>ACT.prepbatch());const b=S.batches[S.batches.length-1];let blocked=false;try{ACT.signbatch(el(b.id))}catch(e){blocked=true}if(!blocked)throw new Error('manager signed');['e1','e2','e3'].forEach(e=>{as(e);run(()=>ACT.signbatch(el(b.id)))});if(b.status!=='released')throw new Error('not released');return b.id+' '+money(b.total)});
 step('Both loans active; schedules built; ledger loan balance matches',()=>{if(LA.status!=='active'||LB.status!=='active')throw new Error('not active');check();return 'receivable '+money(balance('1100'))});
 step('Loan C declined by Credit (2 declines), Loan D declined when a guarantor refuses',()=>{LC=applyLoan(M[2],90000,12,guars(M[2],5));approveAll(LC);['c1','c2'].forEach(c=>{as(c);run(()=>ACT.verifypay(el(LC.id)));run(()=>ACT.vote(el(LC.id,{v:'decline'})))});if(LC.status!=='declined')throw new Error('C '+LC.status);
  LD=applyLoan(M[3],60000,12,guars(M[3],5));as(LD.guars[0].uid);run(()=>ACT.gdecline(el(LD.id)));if(LD.status!=='declined')throw new Error('D '+LD.status)});
 step('Declined loans free the guarantors’ pledges',()=>{const n=S.users.filter(x=>committed(x.id)>0).length;check();return n+' members still carry pledges (loans A, B)'});
 step('Month 1: A pays its first instalment; B does not',()=>{CLOCK+=31;S.clock=CLOCK;ensurePeriods();runArrears();as('mg1');run(()=>ACT.repay(el(LA.id)))});
 step('Month 2: A pays late → penalty is charged and posted to fee income',()=>{CLOCK+=36;S.clock=CLOCK;runArrears();as('mg1');const p0=balance('4100'),pen=penaltyDue(LA);run(()=>ACT.repay(el(LA.id)));if(!(pen>0)||Math.abs(balance('4100')-p0-pen)>0.01)throw new Error('penalty not posted');return 'penalty '+money(pen)});
 step('B reaches stage 2: member and guarantors notified',()=>{CLOCK+=0;runArrears();const st=arrStage(LB);if(st<2)throw new Error('stage '+st);if(!S.inbox.some(m=>m.uid===LB.guars[0].uid&&/days late/.test(m.text)))throw new Error('guarantor not told')});
 step('B reaches default (60+ days) → escalated to Executive',()=>{let n=0;while(arrStage(LB)<3&&n++<12){CLOCK+=10;S.clock=CLOCK;runArrears()}if(arrStage(LB)<3)throw new Error('never defaulted');if(!LB.defaulted)throw new Error('no escalation flag');return daysLate(LB)+' days late'});
 step('Executive calls guarantees → recovered from guarantors pro rata',()=>{as('e2');const g0=U(LB.guars[0].uid).savings,bal=loanBal(LB);run(()=>ACT.invoke(el(LB.id)));if(LB.status!=='recovered')throw new Error(LB.status);if(Math.abs(g0-U(LB.guars[0].uid).savings-bal/5)>0.02)throw new Error('pro-rata share wrong');check();return money(bal)+' recovered'});
 step('Loan A top-up to KSh 200,000 clears the old balance',()=>{as('mg1');while(LA.schedule.filter(r=>!r.paid).length&&daysLate(LA)>0)run(()=>ACT.repay(el(LA.id)));
  const old=loanBal(LA),LT=applyLoan(M[7],200000,18,guars(M[7],5),LA.id);approveAll(LT);credit(LT,['c1','c2','c3']);exec(LT);const cash0=balance('1000');batch(['L:'+LT.id]);
  if(LT.status!=='active'||LA.status!=='cleared')throw new Error(LT.status+'/'+LA.status);if(Math.abs(cash0-balance('1000')-(200000-old))>0.02)throw new Error('net cash wrong');check();return `net cash ${money(200000-old)} after clearing ${money(old)}`});
 step('Withdrawal: request → batch → 3 signatures → paid',()=>{const m=M[8];as(m);const mx=maxWithdraw(U(m));if(mx<5000)throw new Error('max '+mx);const s0=U(m).savings;run(()=>FORMS.withdraw(fd({amount:5000})));const p=S.payouts[S.payouts.length-1];batch(['P:'+p.id]);if(p.status!=='paid'||U(m).savings!==s0-5000)throw new Error('not paid');check()});
 step('Over-limit withdrawal is refused',()=>{as(M[0]);LAST=null;FORMS.withdraw(fd({amount:99999999}));if(!(LAST&&LAST.err))throw new Error('accepted');LAST=null});
 step('Exit: member with no loans/pledges leaves; savings + shares paid; cannot log in',()=>{const m=M[3];as(m);if(exitBlock(U(m)))throw new Error(exitBlock(U(m)));run(()=>ACT.reqexit());const p=S.payouts[S.payouts.length-1];batch(['P:'+p.id]);if(!U(m).exited||U(m).savings!==0)throw new Error('not exited');check()});
 step('Exit blocked while pledges exist',()=>{const busy=S.users.find(x=>MEMBERISH.includes(x.role)&&!x.exited&&committed(x.id)>0);if(!busy)return 'no pledged member left';if(!exitBlock(busy))throw new Error('exit allowed with pledges')});
 step('Interest/dividend run: Manager prepares, 3 Executives sign, members credited',()=>{as('mg1');const d0=distributable();if(!(d0>0))throw new Error('no surplus');const rate=Math.max(0.01,Math.floor(d0/Math.max(1,balance('3100'))*100*0.5*100)/100);run(()=>FORMS.divprep(fd({rate,base:'shares'})));const dv=S.divRuns[S.divRuns.length-1];['e1','e2','e3'].forEach(e=>{as(e);run(()=>ACT.signdiv(el(dv.id)))});if(dv.status!=='paid')throw new Error('not paid');check();return `${rate}% on shares = ${money(dv.total)}`});
 step('Over-surplus dividend refused',()=>{as('mg1');LAST=null;FORMS.divprep(fd({rate:500,base:'savings'}));if(!(LAST&&LAST.err))throw new Error('accepted');LAST=null});
 step('Member cancels an open application and a withdrawal request (pledges released)',()=>{const LX=applyLoan(M[6],60000,12,guars(M[6],5));as(M[6]);run(()=>ACT.cancelloan(el(LX.id)));if(LX.status!=='cancelled')throw new Error(LX.status);if(S.users.some(x=>S.loans.some(l=>l.id===LX.id&&OPEN.includes(l.status))))throw new Error('still open');
  as(M[5]);run(()=>FORMS.withdraw(fd({amount:1000})));const p=S.payouts[S.payouts.length-1];run(()=>ACT.cancelpay(el(p.id)));if(p.status!=='cancelled')throw new Error(p.status);check()});
 step('Executive rejects a payment batch → items go back to the Manager queue',()=>{as(M[5]);run(()=>FORMS.withdraw(fd({amount:2000})));const p=S.payouts[S.payouts.length-1];as('mg1');ui.batchSel={['P:'+p.id]:true};run(()=>ACT.prepbatch());const b=S.batches[S.batches.length-1];as('e1');run(()=>ACT.rejbatch(el(b.id)));if(b.status!=='rejected'||p.status!=='requested')throw new Error(b.status+'/'+p.status);as('mg1');run(()=>ACT.rejpay(el(p.id)));check()});

 step('Journal ≤ limit posts; > limit waits for Executive and posts on approval',()=>{as('mg1');run(()=>FORMS.journal(fd({dr:'5000',cr:'1000',amt:8000,desc:'Office rent'})));run(()=>FORMS.journal(fd({dr:'1000',cr:'1200',amt:300000,desc:'Settle M-Pesa clearing to bank'})));const pj=S.pendingJ.find(j=>j.status==='pending');if(!pj)throw new Error('not pending');as('e3');run(()=>ACT.apprj(el(pj.id)));check()});
 step('Manager reverses a wrong journal; balances return',()=>{as('mg1');const j=S.journals.find(x=>x.desc==='Office rent'),b0=balance('5000');run(()=>ACT.reversej(el(j.id)));if(!S.reversals[j.id])throw new Error('not reversed');if(Math.abs(balance('5000')-(b0-8000))>0.01)throw new Error('balance not restored');LAST=null;ACT.reversej(el(j.id));if(!(LAST&&LAST.err))throw new Error('double reversal allowed');LAST=null;check()});
 step('Period close: Manager closes the earliest month; 3 Supervisory attest',()=>{as('mg1');const pk=Object.keys(S.periods).sort()[0];run(()=>ACT.closeperiod(el(null,{p:pk})));['s1','s2','s3'].forEach(s=>{as(s);run(()=>ACT.attest(el(null,{p:pk})))});if(Object.keys(S.attest[pk]).length!==3)throw new Error('attest');return pk});
 step('Executive access with split token → data unlocked → Supervisory peer review',()=>{as('e4');run(()=>FORMS.access(fd({target:M[7],scope:'Salary & ID',reason:'Verify payslip against payroll for loan A top-up'})));const a=S.access[S.access.length-1];
  LAST=null;FORMS.token(fd({tok:'000000'}),{dataset:{id:a.id}});if(!(LAST&&LAST.err))throw new Error('wrong token accepted');LAST=null;
  if(!S.alerts.some(x=>x.supHalf===a.token.slice(3)))throw new Error('Supervisory did not get second half');run(()=>FORMS.token(fd({tok:a.token}),{dataset:{id:a.id}}));if(a.status!=='granted')throw new Error('not granted');
  as('s1');run(()=>FORMS.review(fd({note:'Reason acceptable'}),{dataset:{id:a.id}}));if(!a.review)throw new Error('not reviewed')});
 step('Manager views salary → SMS alert to Supervisory',()=>{as('mg1');run(()=>ACT.reveal(el(M[1])));if(!S.alerts.some(a=>a.type==='sms'))throw new Error('no alert')});
 step('Policy change needs 3 of 4 Executives (and the 1.5% rate cap holds)',()=>{as('e1');run(()=>FORMS.propose(fd({param:'guarantorDays',value:21})));const p=S.proposals[S.proposals.length-1];['e2','e3'].forEach(e=>{as(e);run(()=>ACT.signpol(el(p.id)))});if(S.policy.guarantorDays!==21)throw new Error('not enacted');as('e1');LAST=null;FORMS.propose(fd({param:'rate',value:0.03}));if(!(LAST&&LAST.err))throw new Error('rate cap bypassed');LAST=null});
 step('Education: progress, EN + SW material, member question answered',()=>{as('d1');run(()=>FORMS.progress(fd({title:'Savings clinic',text:'Held at the chapter office'})));run(()=>FORMS.material(fd({title:'Budgeting',lang:'EN',body:'Plan monthly.'})));run(()=>FORMS.material(fd({title:'Bajeti',lang:'SW',body:'Panga kila mwezi.'})));as(M[0]);run(()=>FORMS.ask(fd({q:'What is a dividend?'})));const q=S.queries[S.queries.length-1];as('d2');run(()=>FORMS.answer(fd({a:'A share of surplus.'}),{dataset:{id:q.id}}));if(!q.a)throw new Error('unanswered')});
 step('Assistant answers from live data (EN and Kiswahili)',()=>{const u=U(M[7]);const a1=assistantLocal('How much can I borrow?',u),a2=assistantLocal('Akiba yangu ni kiasi gani?',u),a3=assistantLocal(`Can I borrow 100000 for 12 months`,u);
  if(!a1.includes(money(elig(u).max)))throw new Error('limit not live');if(!a2.includes(money(u.savings)))throw new Error('savings not live');if(!/^(Yes|Not yet)/.test(a3))throw new Error('no verdict');if(!/Akiba/.test(a2))throw new Error('no SW')});
 step('Member statement CSV has every transaction',()=>{const u=U(M[7]),csv=statementCSV(u);if(csv.split('\n').length<S.txns.filter(t=>t.uid===u.id).length+1)throw new Error('rows missing')});
 step('Final reconciliation: ledger, savings, shares, loans, statements, pledges',check);
 SIM=false;
 step('Every screen of every role renders live data (no undefined / NaN / empty-object text)',()=>{const probs=[];let n=0;
  const pick={member:M[7],external:M[8],manager:'mg1',credit:'c1',exec:'e1',sup:'s1',edu:'d1'};
  Object.keys(ROLES).forEach(r=>ROLES[r].tabs.forEach(t=>{S.session=pick[r];ui.tab=t[0];const u=cur();const fn=VIEWS[r+'_'+t[0]]||VIEWS['member_'+t[0]];let h;try{h=fn(u)}catch(e){probs.push(r+'/'+t[0]+': '+e.message);return}n++;
   if(/undefined|NaN|\[object|Infinity|null/.test(h.replace(/data-[a-z-]+="[^"]*"/g,'')))probs.push(r+'/'+t[0]+' contains bad text: '+(h.match(/.{15}(undefined|NaN|\[object|Infinity|null).{10}/)||[''])[0])}));
  if(probs.length)throw new Error(probs.slice(0,4).join(' | '));return n+' screens checked'});
 }finally{SIM=false}
 S.session=null;ui.tab=null;audit('simulation','complete','system');return L}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='BUTTON'&&el.disabled)return;try{ACT[el.dataset.act](el,e)}catch(err){console.error(err);toast(err.message,1)}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();try{FORMS[f.dataset.form](new FormData(f),f)}catch(err){console.error(err);toast(err.message,1)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(!el)return;try{CHG[el.dataset.change](el)}catch(err){console.error(err);toast(err.message,1)}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(!el)return;const a=ui.apply;
 if(el.dataset.input==='amount')a.amount=el.value;else if(el.dataset.input==='gamt')a.gamt[+el.dataset.i]=el.value;
 const c=$('#calc'),g=$('#gsum');if(c)c.innerHTML=calcHtml(cur());if(g)g.innerHTML=gsumHtml()});
window.addEventListener('error',e=>{const a=$('#app');if(a&&!a.innerHTML.trim())a.innerHTML=`<main><div class="card"><h3>CoopVault could not start</h3><p class="bad">${esc(e.message)}</p><p class="small">Try a hard refresh (Ctrl+Shift+R), or clear this site's data, then reload.</p></div></main>`});
window.addEventListener('online',()=>toast('Back online'));window.addEventListener('offline',()=>toast('Offline — your data stays on this device'));
window.CV={selfCheck,get S(){return S},ui,ACT,FORMS,CHG,VIEWS,render,save,simulate,reconcile,assistantLocal,askAI,statementCSV,c2b,get CLOCK(){return CLOCK}};
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
applyLite();render();
